<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atomix — Oliy Ta’lim Fizika va Virtual 3D Simulyatsiyalar Platformasi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/atomix.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button id="sidebar-toggle" class="icon-btn" type="button" title="Mundarija panelini yopish/ochish" aria-label="Mundarija paneli">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>

      <a class="brand" href="#topic=1-1&tab=theory">
        <span class="brand-logo" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <ellipse cx="12" cy="12" rx="9" ry="3.8" transform="rotate(35 12 12)" />
            <ellipse cx="12" cy="12" rx="9" ry="3.8" transform="rotate(-35 12 12)" />
            <circle cx="12" cy="12" r="2.2" fill="currentColor" />
          </svg>
        </span>
        <span class="brand-text">
          <strong>Atomix</strong>
          <span>Oliy Fizika &amp; 3D Laboratoriya</span>
        </span>
      </a>

      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input id="topic-search" class="search-input" type="search" placeholder="67 ta mavzu, formula yoki qonun bo‘yicha qidirish..." autocomplete="off" />
        <div id="search-results" class="search-results" hidden></div>
      </div>

      <div class="global-progress tabular" title="Umumiy test natijalari">
        <span>Testlar:</span>
        <strong id="global-score">0 / 1340</strong>
      </div>
    </div>

    <nav id="section-strip" class="section-strip" aria-label="Fizika bo‘limlari"></nav>
  </header>

  <div id="app-shell" class="app-shell">
    <div id="drawer-backdrop" class="drawer-backdrop"></div>
    <aside id="sidebar" class="sidebar" aria-label="Mavzular mundarijasi"></aside>

    <main class="workspace">
      <div class="topic-header">
        <div>
          <div id="topic-breadcrumb" class="topic-breadcrumb tabular"></div>
          <h1 id="topic-title" class="topic-title"></h1>
          <p id="topic-subtitle" class="topic-subtitle"></p>
        </div>
        <div class="topic-nav-btns">
          <button id="prev-topic-btn" class="btn" type="button">← Oldingi mavzu</button>
          <button id="next-topic-btn" class="btn btn-primary" type="button">Keyingi mavzu →</button>
        </div>
      </div>

      <div class="tabs-bar" role="tablist" aria-label="Mavzu bo‘limlari">
        <button class="tab-btn active" data-tab="theory" role="tab" aria-selected="true" type="button">
          <span class="tab-num">1</span>
          <span class="tab-text-full">Mavzuga oid ma’lumot</span>
        </button>
        <button class="tab-btn" data-tab="sim" role="tab" aria-selected="false" type="button">
          <span class="tab-num">2</span>
          <span class="tab-text-full">Virtual Simulyatsiya</span>
        </button>
        <button class="tab-btn" data-tab="quiz" role="tab" aria-selected="false" type="button">
          <span class="tab-num">3</span>
          <span class="tab-text-full">Test savollari (20 ta)</span>
        </button>
      </div>

      <section id="tab-panel-theory"></section>
      <section id="tab-panel-sim" hidden></section>
      <section id="tab-panel-quiz" hidden></section>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
