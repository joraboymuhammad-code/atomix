<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atomix Kimyo Virtual Laboratoriyasi (PhET / ChemCollective / Amrita OLabs)</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #060a17; color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }
    .shell { display: flex; flex-direction: column; height: 100%; }
    .bar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 14px; background: rgba(9, 15, 32, 0.92);
      border-bottom: 1px solid rgba(52, 211, 153, 0.25);
    }
    .tag {
      font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 3px 8px; border-radius: 6px;
      background: rgba(56, 189, 248, 0.14); border: 1px solid rgba(56, 189, 248, 0.35); color: #38bdf8;
    }
    .bar-left { display: flex; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 700; }
    .controls { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    select, button {
      background: rgba(15, 23, 42, 0.9); color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.28); border-bottom: 3px solid #020617;
      border-radius: 8px; padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    button.active, button:hover { border-color: #34d399; background: rgba(52, 211, 153, 0.15); color: #fff; }
    .main { position: relative; flex: 1; display: grid; grid-template-columns: 1fr 270px; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; background: #050814; }
    .side {
      background: rgba(8, 13, 27, 0.92); border-left: 1px solid rgba(148, 163, 184, 0.18);
      padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
    }
    .ctrl-box {
      padding: 10px 12px; border-radius: 10px; background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.16);
    }
    .ctrl-box label { display: flex; justify-content: space-between; font-size: 12px; color: #cbd5e1; margin-bottom: 6px; }
    .ctrl-box strong { color: #34d399; font-family: 'JetBrains Mono', monospace; }
    input[type="range"] { width: 100%; accent-color: #34d399; }
    .readout {
      padding: 12px; border-radius: 10px; background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.32); font-size: 12.5px; line-height: 1.55;
    }
    .readout h4 { margin: 0 0 6px; color: #34d399; font-size: 12.5px; }
    iframe.phet-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: none; z-index: 20; background: #050814; }
    @media (max-width: 720px) { .main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } }
  </style>
</head>
<body>
  <div class="shell">
    <div class="bar">
      <div class="bar-left">
        <span class="tag">ChemCollective · PhET · OLabs</span>
        <span id="lab-title">Kimyo Virtual Laboratoriyasi</span>
      </div>
      <div class="controls">
        <select id="lab-select"></select>
        <button id="phet-toggle" type="button">PhET HTML5 Rejim</button>
      </div>
    </div>
    <div class="main">
      <canvas id="bench"></canvas>
      <div class="side" id="side-panel"></div>
      <iframe id="phet-frame" class="phet-frame" hidden></iframe>
    </div>
  </div>

  <script>
    const LABS = {
      ph_scale: {
        title: 'PhET pH Shkalasi va Gidroliz Laboratoriyasi',
        phetUrl: 'https://phet.colorado.edu/sims/html/ph-scale/latest/ph-scale_uz.html',
        controls: [
          { key: 'pH', label: 'Eritma pH', min: 1, max: 14, step: 0.2, val: 3.0, unit: '' },
          { key: 'ind', label: 'Indikator (1:Lakmus 2:Fenolft 3:Metil)', min: 1, max: 3, step: 1, val: 1, unit: '' },
        ],
        summary: (v) => {
          const hConc = Math.pow(10, -v.pH).toExponential(1);
          const muhit = v.pH < 6.8 ? 'Kislotali muhit ([H⁺] > 10⁻⁷)' : v.pH > 7.2 ? 'Ishqoriy muhit ([OH⁻] > 10⁻⁷)' : 'Neytral muhit (pH = 7)';
          return `${muhit}\n[H⁺] = ${hConc} mol/L\npOH = ${(14 - v.pH).toFixed(1)}`;
        },
      },
      titration: {
        title: 'ChemCollective Kislota-Asosli Titrlash',
        phetUrl: 'https://phet.colorado.edu/sims/html/acid-base-solutions/latest/acid-base-solutions_en.html',
        controls: [
          { key: 'volNaOH', label: 'Qo‘shilgan NaOH (0.1M)', min: 0, max: 50, step: 1, val: 20, unit: 'mL' },
          { key: 'acidVol', label: 'HCl (0.1M) hajmi', min: 15, max: 35, step: 5, val: 25, unit: 'mL' },
        ],
        summary: (v) => {
          const diff = v.volNaOH - v.acidVol;
          const ph = Math.abs(diff) < 0.5 ? 7.0 : diff < 0 ? clamp(1.3 + (v.volNaOH / v.acidVol) * 2.4, 1, 6.5) : clamp(10.5 + (diff / 25) * 2.3, 7.5, 13);
          return `Ekvivalent nuqta: ${v.acidVol} mL\nJoriy pH = ${ph.toFixed(2)}\n${Math.abs(diff) < 1 ? 'NEUTRALIZATSIYA NUQTASI!' : diff < 0 ? 'Kislota ortiqcha' : 'Ishqor ortiqcha (Fenolftalein pushti)'}`;
        },
      },
      flame_test: {
        title: 'Amrita OLabs Sifat Analizi: Alanga Rangi Testi',
        phetUrl: 'https://phet.colorado.edu/sims/html/build-an-atom/latest/build-an-atom_en.html',
        controls: [
          { key: 'cation', label: 'Kation (1:Li⁺ 2:Na⁺ 3:K⁺ 4:Cu²⁺ 5:Ba²⁺ 6:Ca²⁺)', min: 1, max: 6, step: 1, val: 4, unit: '' },
          { key: 'temp', label: 'Alanga harorati', min: 800, max: 1800, step: 50, val: 1300, unit: '°C' },
        ],
        summary: (v) => {
          const map = [
            ['Li⁺', 'Qirmizi-qizil (671 nm)'],
            ['Na⁺', 'Yorqin sariq (589 nm)'],
            ['K⁺', 'Binafsha (766 nm)'],
            ['Cu²⁺', 'Zumrad-yashil (515 nm)'],
            ['Ba²⁺', 'Sariq-yashil (524 nm)'],
            ['Ca²⁺', 'G‘isht-qizil (622 nm)'],
          ];
          const [ion, desc] = map[(Math.round(v.cation) - 1) % 6];
          return `Tekshirilayotgan kation: ${ion}\nSpektral alanga rangi: ${desc}`;
        },
      },
      redox_galvanic: {
        title: 'Daniel-Yakobi Galvanik Elementi va Elektroliz',
        phetUrl: 'https://phet.colorado.edu/sims/html/Faradays-electromagnetic-lab/latest/faradays-electromagnetic-lab_en.html',
        controls: [
          { key: 'anod', label: 'Anod (1:Zn −0.76V, 2:Mg −2.37V, 3:Fe −0.44V)', min: 1, max: 3, step: 1, val: 1, unit: '' },
          { key: 'katod', label: 'Katod (1:Cu +0.34V, 2:Ag +0.80V)', min: 1, max: 2, step: 1, val: 1, unit: '' },
        ],
        summary: (v) => {
          const anodes = [['Zn', -0.76], ['Mg', -2.37], ['Fe', -0.44]];
          const cathodes = [['Cu', 0.34], ['Ag', 0.80]];
          const [aN, aE] = anodes[Math.round(v.anod) - 1];
          const [kN, kE] = cathodes[Math.round(v.katod) - 1];
          return `Juftlik: ${aN} (−) | ${kN} (+)\nEYUK = ${(kE - aE).toFixed(2)} V\nAnodda oksidlanish, katodda qaytarilish!`;
        },
      },
      periodic: {
        title: 'PhET Davriy Jadval va Atom Radiuslari',
        phetUrl: 'https://phet.colorado.edu/sims/html/build-an-atom/latest/build-an-atom_en.html',
        controls: [
          { key: 'Z', label: 'Tartib raqam Z', min: 1, max: 20, step: 1, val: 11, unit: '' },
        ],
        summary: (v) => {
          const els = ['H','He','Li','Be','B','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar','K','Ca'];
          const sym = els[Math.round(v.Z) - 1] || 'Na';
          const period = v.Z <= 2 ? 1 : v.Z <= 10 ? 2 : v.Z <= 18 ? 3 : 4;
          return `Element: ${sym} (Z = ${Math.round(v.Z)})\nDavr: ${period} | Protonlar: ${Math.round(v.Z)} ta`;
        },
      },
      stoichiometry: {
        title: 'PhET Tenglamalar va Mol Stoxiometriyasi',
        phetUrl: 'https://phet.colorado.edu/sims/html/balancing-chemical-equations/latest/balancing-chemical-equations_en.html',
        controls: [
          { key: 'nH2', label: 'H₂ miqdori (mol)', min: 1, max: 10, step: 1, val: 4, unit: 'mol' },
          { key: 'nO2', label: 'O₂ miqdori (mol)', min: 1, max: 6, step: 1, val: 2, unit: 'mol' },
        ],
        summary: (v) => {
          const reactedPairs = Math.min(Math.floor(v.nH2 / 2), v.nO2);
          const water = reactedPairs * 2;
          return `Reaksiya: 2H₂ + O₂ → 2H₂O\nHosil bo‘lgan suv: ${water} mol (${water * 18} g)`;
        },
      },
      kinetics: {
        title: 'PhET Reaksiyalar Tezligi va Kataliz',
        phetUrl: 'https://phet.colorado.edu/sims/html/reactions-and-rates/latest/reactions-and-rates_en.html',
        controls: [
          { key: 'T', label: 'Harorat T', min: 280, max: 420, step: 10, val: 320, unit: 'K' },
          { key: 'cat', label: 'Katalizator (0:Yo‘q 1:Bor)', min: 0, max: 1, step: 1, val: 1, unit: '' },
        ],
        summary: (v) => {
          const vg = Math.pow(2.2, (v.T - 300) / 10) * (v.cat ? 4.5 : 1);
          return `Nisbiy tezlik: ${vg.toFixed(1)}×\n${v.cat ? 'Katalizator faollanish energiyasini Ea kamaytirdi!' : 'Katalizatorsiz yuqori energetik to‘siq'}`;
        },
      },
      equilibrium: {
        title: 'Le Shatelye Prinsipi va Kimyoviy Muvozanat',
        phetUrl: 'https://phet.colorado.edu/sims/html/reversible-reactions/latest/reversible-reactions_en.html',
        controls: [
          { key: 'P', label: 'Bosim (atm)', min: 1, max: 10, step: 1, val: 5, unit: 'atm' },
          { key: 'T', label: 'Harorat (°C)', min: 200, max: 600, step: 25, val: 400, unit: '°C' },
        ],
        summary: (v) => {
          const nh3 = clamp(15 + v.P * 4.5 - (v.T - 200) * 0.05, 5, 85);
          return `N₂ + 3H₂ ⇌ 2NH₃ (−92 kJ)\nAmmiak unumi: ${nh3.toFixed(1)}%\nYuqori bosim → o‘ngga siljiydi!`;
        },
      },
      separation: {
        title: 'Aralashmalarni Ajratish va Distillyatsiya (OLabs)',
        phetUrl: 'https://phet.colorado.edu/sims/html/states-of-matter-basics/latest/states-of-matter-basics_en.html',
        controls: [
          { key: 'temp', label: 'Qizdirish harorati', min: 25, max: 115, step: 1, val: 82, unit: '°C' },
        ],
        summary: (v) => {
          const mode = v.temp < 78 ? 'Qizish davom etmoqda' : v.temp < 100 ? 'Etanol (78.4°C) bug‘lanib distillyatga tushmoqda!' : 'Suv (100°C) ham qaynashga o‘tdi!';
          return `Spirt (78.4°C) + Suv (100°C) aralashmasi\n${mode}`;
        },
      },
      spectroscopy: {
        title: 'UV-Vis Spektrofotometriya va YaMR Analiz',
        phetUrl: 'https://phet.colorado.edu/sims/html/beers-law-lab/latest/beers-law-lab_en.html',
        controls: [
          { key: 'conc', label: 'Konsentratsiya C', min: 0.1, max: 2.0, step: 0.1, val: 0.8, unit: 'M' },
          { key: 'lam', label: 'To‘lqin uzunligi λ', min: 400, max: 700, step: 10, val: 520, unit: 'nm' },
        ],
        summary: (v) => {
          const eps = Math.exp(-Math.pow((v.lam - 525) / 55, 2)) * 1.1;
          const A = eps * v.conc;
          const T = Math.pow(10, -A) * 100;
          return `Buger-Lambert-Ber qonuni: A = ε·l·C\nOptik zichlik A = ${A.toFixed(2)}\nO‘tkazuvchanlik T = ${T.toFixed(1)}%`;
        },
      },
    };

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    const sel = document.getElementById('lab-select');
    Object.entries(LABS).forEach(([k, v]) => {
      const o = document.createElement('option');
      o.value = k; o.textContent = v.title; sel.appendChild(o);
    });

    const params = new URLSearchParams(location.search);
    let curKey = LABS[params.get('lab')] ? params.get('lab') : 'ph_scale';
    let values = {};
    let usePhet = false;

    const canvas = document.getElementById('bench');
    const ctx = canvas.getContext('2d');
    const side = document.getElementById('side-panel');
    const phetFrame = document.getElementById('phet-frame');
    const phetBtn = document.getElementById('phet-toggle');

    function loadLab(key) {
      curKey = key;
      sel.value = key;
      const lab = LABS[key];
      document.getElementById('lab-title').textContent = lab.title;
      values = {};
      lab.controls.forEach((c) => (values[c.key] = c.val));
      renderControls();
      if (usePhet) phetFrame.src = lab.phetUrl;
    }

    function renderControls() {
      const lab = LABS[curKey];
      side.innerHTML = lab.controls.map((c) => `
        <div class="ctrl-box">
          <label><span>${c.label}</span><strong id="ro-${c.key}">${values[c.key]} ${c.unit}</strong></label>
          <input type="range" data-k="${c.key}" min="${c.min}" max="${c.max}" step="${c.step}" value="${values[c.key]}" />
        </div>`).join('') + `<div class="readout" id="lab-summary"></div>`;
      updateSummary();
    }

    function updateSummary() {
      const el = document.getElementById('lab-summary');
      if (el) el.innerHTML = `<h4>Tahlil natijasi</h4>${LABS[curKey].summary(values).replaceAll('\n', '<br>')}`;
    }

    side.addEventListener('input', (e) => {
      const k = e.target.dataset.k;
      if (!k) return;
      values[k] = Number(e.target.value);
      const ro = document.getElementById(`ro-${k}`);
      const cDef = LABS[curKey].controls.find((x) => x.key === k);
      if (ro && cDef) ro.textContent = `${values[k]} ${cDef.unit}`;
      updateSummary();
    });

    sel.addEventListener('change', () => loadLab(sel.value));
    phetBtn.addEventListener('click', () => {
      usePhet = !usePhet;
      phetBtn.classList.toggle('active', usePhet);
      phetFrame.hidden = !usePhet;
      if (usePhet) phetFrame.src = LABS[curKey].phetUrl;
    });

    let t = 0;
    function draw() {
      t += 0.025;
      const rect = canvas.getBoundingClientRect();
      if (rect.width > 20 && rect.height > 20) {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        if (canvas.width !== Math.round(rect.width * dpr)) {
          canvas.width = Math.round(rect.width * dpr);
          canvas.height = Math.round(rect.height * dpr);
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const w = rect.width, h = rect.height, cx = w / 2, cy = h / 2;
        ctx.fillStyle = '#050814';
        ctx.fillRect(0, 0, w, h);

        // Lab Grid
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.06)';
        for (let x = 32; x < w; x += 32) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
        for (let y = 32; y < h; y += 32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

        if (curKey === 'ph_scale' || curKey === 'titration') {
          const ph = curKey === 'ph_scale' ? values.pH : (Math.abs(values.volNaOH - values.acidVol) < 0.5 ? 7 : values.volNaOH < values.acidVol ? 3 : 11);
          const col = ph < 6.5 ? `hsl(${ph * 10}, 90%, 55%)` : ph > 7.5 ? `hsl(${210 + (ph - 7) * 14}, 85%, 55%)` : '#34d399';
          // Glass Beaker
          ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
          ctx.strokeRect(cx - 85, cy - 60, 170, 145);
          ctx.fillStyle = col; ctx.globalAlpha = 0.65;
          ctx.fillRect(cx - 82, cy - 10, 164, 92);
          ctx.globalAlpha = 1;
          for (let i = 0; i < 16; i++) {
            const bx = cx - 70 + ((i * 29 + t * 22) % 140);
            const by = cy + 6 + Math.sin(t * 2 + i) * 32;
            ctx.fillStyle = ph < 7 ? '#fef08a' : '#a7f3d0';
            ctx.beginPath(); ctx.arc(bx, by, 4, 0, Math.PI * 2); ctx.fill();
          }
          ctx.fillStyle = '#f8fafc'; ctx.font = '700 22px JetBrains Mono, monospace'; ctx.textAlign = 'center';
          ctx.fillText(`pH = ${ph.toFixed(1)}`, cx, cy - 82);
        } else if (curKey === 'flame_test') {
          const colors = ['#f43f5e', '#facc15', '#c084fc', '#10b981', '#a3e635', '#fb923c'];
          const cHex = colors[(Math.round(values.cation) - 1) % 6];
          ctx.fillStyle = '#475569'; ctx.fillRect(cx - 18, h - 90, 36, 65);
          for (let i = 0; i < 6; i++) {
            const r = (52 - i * 7) * (0.9 + 0.12 * Math.sin(t * 8 + i));
            const g = ctx.createRadialGradient(cx, h - 135, 2, cx, h - 135, r * 1.4);
            g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, cHex); g.addColorStop(1, 'transparent');
            ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(cx, h - 140 - i * 6, r * 0.65, r * 1.45, 0, 0, Math.PI * 2); ctx.fill();
          }
        } else if (curKey === 'spectroscopy') {
          const col = `hsl(${clamp(660 - values.lam, 0, 270)}, 90%, 55%)`;
          ctx.fillStyle = '#1e293b'; ctx.fillRect(48, cy - 34, 42, 68);
          ctx.strokeStyle = col; ctx.lineWidth = 8;
          ctx.beginPath(); ctx.moveTo(90, cy); ctx.lineTo(cx - 40, cy); ctx.stroke();
          ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3; ctx.strokeRect(cx - 40, cy - 55, 80, 110);
          ctx.fillStyle = 'rgba(56,189,248,0.28)'; ctx.fillRect(cx - 38, cy - 25, 76, 78);
          ctx.strokeStyle = col; ctx.globalAlpha = clamp(1 - values.conc * 0.4, 0.15, 0.95);
          ctx.beginPath(); ctx.moveTo(cx + 40, cy); ctx.lineTo(w - 60, cy); ctx.stroke();
          ctx.globalAlpha = 1;
        } else {
          // Animated 3D molecular / particle reaction chamber for other chemistry modes
          const cnt = 28;
          const spd = curKey === 'kinetics' ? (values.T / 300) * 1.8 : 1.0;
          ctx.strokeStyle = 'rgba(52, 211, 153, 0.35)'; ctx.lineWidth = 2;
          ctx.strokeRect(48, 36, w - 96, h - 72);
          for (let i = 0; i < cnt; i++) {
            const px = 64 + Math.abs(Math.sin(i * 2.13 + t * spd * 0.8)) * (w - 128);
            const py = 54 + Math.abs(Math.cos(i * 3.47 + t * spd * 0.9)) * (h - 108);
            ctx.fillStyle = i % 3 === 0 ? '#34d399' : i % 3 === 1 ? '#38bdf8' : '#fb923c';
            ctx.beginPath(); ctx.arc(px, py, i % 3 === 0 ? 8 : 5.5, 0, Math.PI * 2); ctx.fill();
          }
        }
      }
      requestAnimationFrame(draw);
    }

    loadLab(curKey);
    draw();
  </script>
</body>
</html>
