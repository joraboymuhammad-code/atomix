  function translateString(str) {
    if (!str || typeof str !== 'string') return str;
    let out = str;
    for (const [en, uz] of PHRASES) {
      if (out.includes(en)) {
        out = out.split(en).join(uz);
      } else {
        const re = new RegExp(en.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        if (re.test(out)) out = out.replace(re, uz);
      }
    }
    // Single-word whole-token replacements for common labels
    out = out.replace(/\b([A-Za-z][A-Za-z\s\/]{1,22})\b/g, (m) => {
      const upper = m.trim().toUpperCase();
      if (WORDS.has(upper)) return WORDS.get(upper);
      return m;
    });
    return out;
  }

  let translating = false;
  function translateDOM(root) {
    if (translating || !root) return;
    translating = true;
    try {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      let node;
      while ((node = walker.nextNode())) {
        const parent = node.parentElement;
        if (!parent) continue;
        const tag = parent.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'CODE' || parent.closest('.atomix-skip-translate')) continue;
        const orig = node.nodeValue;
        if (!orig || !/[A-Za-z]{2,}/.test(orig)) continue;
        const next = translateString(orig);
        if (next !== orig) node.nodeValue = next;
      }

      // Wire theory button if present
      const theoryBtn = document.getElementById('theorybutton');
      if (theoryBtn && !theoryBtn.dataset.atomixWired) {
        theoryBtn.dataset.atomixWired = '1';

        theoryBtn.onclick = function (e) {

          window.theorySite();
        };
      }
    } finally {
      translating = false;
    }
  }

  function initBridge() {
    if (!document.body) return;
    translateDOM(document.body);

    // Keep anchor links (#section) inside the local localized page instead of following <base href>
    document.addEventListener('click', (e) => {
      const a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
      if (!a) return;
      const hash = a.getAttribute('href');
      if (hash && hash.length > 1) {
        const target = document.getElementById(hash.slice(1));
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth' });
        }
      }
    });

    const observer = new MutationObserver((mutations) => {
      if (translating) return;
      for (const m of mutations) {
        for (const n of m.addedNodes) {
          if (n.nodeType === 1) translateDOM(n);
          else if (n.nodeType === 3 && n.parentElement) translateDOM(n.parentElement);
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true, characterData: false });

    // Periodic light pass for dynamic table/lil-gui text mutations
    setInterval(() => translateDOM(document.body), 900);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initBridge);
  } else {
    initBridge();
  }
})();

            width: 100%;
            height: 100%;
            background: #fafafa;
            border-radius: 12px;
            cursor: grab;
        }

        .node circle { stroke: #fff; stroke-width: 2px; transition: stroke-width 0.2s; }
        .node:hover circle { stroke-width: 4px; stroke: var(--orange-light); }
        .node text { font-size: 12px; font-weight: 600; pointer-events: none; fill: var(--dark-blue); }
        .link { stroke: #cbd5e1; stroke-opacity: 0.6; stroke-width: 2px; }

        .tooltip {
            position: absolute;
            background: rgba(1, 44, 89, 0.95);
            color: white;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            pointer-events: none;
            display: none;
            max-width: 280px;
            z-index: 2000;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            line-height: 1.5;
        }

        /* PREMIUM FLASHCARD STYLE */
        .flashcard-wrapper {
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }

        .flashcard {
            height: 300px;
            perspective: 1000px;
            margin-bottom: 25px;
            cursor: pointer;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }

        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            border-radius: 24px;
            border: 2px solid var(--cyan);
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .flashcard-back {
            background: white;
            transform: rotateY(180deg);
        }

        .fc-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
            color: var(--dark-blue);
            margin-bottom: 20px;
        }

        .fc-content {
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.4;
            color: var(--dark-blue);
        }

        .fc-hint {
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .flashcard-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        /* Quiz */
        .quiz-container { max-width: 700px; margin: 0 auto; }
        .option-btn {
            display: block; width: 100%; padding: 18px; background: #f8fafc;
            border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer;
            text-align: left; transition: all 0.2s; margin-bottom: 12px;
            font-size: 1rem; font-weight: 500;
        }
        .option-btn:hover { border-color: var(--cyan); background: #f0fdfa; transform: translateX(5px); }
        .option-btn.correct { background: #dcfce7; border-color: #22c55e; color: #166534; }
        .option-btn.wrong { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .feedback { margin-top: 1.5rem; padding: 1.2rem; border-radius: 10px; display: none; font-weight: 600; text-align: center; }
    </style>
</head>
<body>

    <main>
        <!-- Simulation Tab -->
        <section id="module" class="tab-content active">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 style="font-size: 1.25rem;">Lab Simulation</h2>
                    <a id="ext-link" href="https://effectuall-sims.netlify.app/simulations/optics_refraction_of_light" target="_blank" style="color: var(--cyan-dark); text-decoration: none; font-size: 0.8rem; font-weight: 700;">
                        <i data-lucide="maximize" style="width:14px; vertical-align:middle;"></i> FULLSCREEN
                    </a>
                </div>

                <div class="sim-selector">
                    <button class="sim-btn active" onclick="changeSim('refraction', this)">Refraction</button>
                    <button class="sim-btn" onclick="changeSim('tir', this)">T.I.R.</button>
                    <button class="sim-btn" onclick="changeSim('depth', this)">Depth</button>
                </div>

                <div class="iframe-container">
                    <iframe id="sim-frame" src="https://effectuall-sims.netlify.app/simulations/optics_refraction_of_light"></iframe>
                </div>
            </div>
        </section>

        <!-- Knowledge Graph Tab -->
        <section id="graph" class="tab-content">
            <div class="card">
                <h2 style="font-size: 1.25rem; margin-bottom: 1rem;">Concept Map</h2>
                <div id="graph-container">
                    <svg id="graph-svg"></svg>
                    <div id="tooltip" class="tooltip"></div>
                </div>
            </div>
        </section>

        <!-- Flashcards Tab -->
        <section id="flashcards" class="tab-content">
             <div class="card">
                <h2 style="font-size: 1.25rem; margin-bottom: 5rem;">Let's Revise</h2>
            <div class="flashcard-wrapper">
                <div class="flashcard" id="current-card" onclick="this.classList.toggle('flipped')">
                    <div class="flashcard-inner" id="card-inner-content">
                        <!-- Content injected by JS -->
                    </div>
                </div>
                <div class="flashcard-nav">
                    <button class="nav-circle-btn" onclick="prevCard()"><i data-lucide="chevron-left"></i></button>
                    <div class="fc-counter" id="fc-counter">1 / 3</div>
                    <button class="nav-circle-btn" onclick="nextCard()"><i data-lucide="chevron-right"></i></button>
                </div>
            </div>
            </div>
        </section>

        <!-- Quiz Tab -->
        <section id="quiz" class="tab-content">
            <div class="card">
                <h2 style="font-size: 1.25rem; margin-bottom: 5rem;">Knowledge Check</h2>
                <div id="quiz-body"></div>
                <div id="quiz-feedback" style="margin-top:15px; padding:12px; border-radius:8px; display:none; text-align:center; font-weight:600;"></div>
            </div>
        </section>
    </main>

    <!-- Floating Dock -->
    <nav class="bottom-nav">
        <div class="nav-item">
            <span class="nav-label">Refraction</span>
            <button class="nav-btn active" onclick="showTab('module', this)">
                <i data-lucide="compass"></i>
            </button>
        </div>
        <div class="nav-item">
            <span class="nav-label">Graph</span>
            <button class="nav-btn" onclick="showTab('graph', this)">
                <i data-lucide="network"></i>
            </button>
        </div>
        <div class="nav-item">
            <span class="nav-label">Flashcards</span>
            <button class="nav-btn" onclick="showTab('flashcards', this)">
                <i data-lucide="layers"></i>
            </button>
        </div>
        <div class="nav-item">
            <span class="nav-label">Quiz</span>
            <button class="nav-btn" onclick="showTab('quiz', this)">
                <i data-lucide="check-circle"></i>
            </button>
        </div>
    </nav>
    </main>

    <script>
         lucide.createIcons();

        const simUrls = {
            refraction: "https://effectuall-sims.netlify.app/simulations/optics_refraction_of_light",
            tir: "https://effectuall-sims.netlify.app/simulations/optics_total_internal_reflection",
            depth: "https://effectuall-sims.netlify.app/simulations/optics_apparent_depth"
        };

        function changeSim(type, btn) {
            document.querySelectorAll('.sim-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const url = simUrls[type];
            document.getElementById('sim-frame').src = url;
            document.getElementById('ext-link').href = url;
        }

        function showTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if(tabId === 'graph') initD3Graph();
        }

       const nodes = [
            { id: 'Refraction', group: 1, desc: 'The bending of light as it passes from one medium to another due to a change in speed.' },
            { id: "Snell's Law", group: 2, desc: 'The ratio of the sines of the angles of incidence and refraction is constant: $n_1 \\sin \\theta_1 = n_2 \\sin \\theta_2$.' },
            { id: 'Refractive Index', group: 2, desc: 'A measure of how much light slows down in a medium. $n = c/v$.' },
            { id: 'Optical Density', group: 2, desc: 'A property of a medium that indicates its ability to slow down light waves.' },
            { id: 'Critical Angle', group: 3, desc: 'The angle of incidence for which the angle of refraction is 90 degrees.' },
            { id: 'Total Internal Reflection', group: 3, desc: 'Occurs when light travels from a denser to a less dense medium at an angle greater than the critical angle.' },
            { id: 'Normal Line', group: 4, desc: 'An imaginary line perpendicular to the surface at the point of incidence.' },
            { id: 'Apparent Depth', group: 5, desc: 'The perceived depth of an object under water, appearing shallower than its real depth due to refraction.' },
            { id: 'Angle of Incidence', group: 4, desc: 'The angle between the incident ray and the normal.' },
            { id: 'Angle of Refraction', group: 4, desc: 'The angle between the refracted ray and the normal.' }
        ];

        const links = [
            { source: 'Refraction', target: "Snell's Law", value: 1 },
            { source: 'Refraction', target: 'Refractive Index', value: 1 },
            { source: 'Refraction', target: 'Optical Density', value: 1 },
            { source: 'Refractive Index', target: "Snell's Law", value: 1 },
            { source: 'Refraction', target: 'Normal Line', value: 1 },
            { source: 'Refraction', target: 'Critical Angle', value: 1 },
            { source: 'Critical Angle', target: 'Total Internal Reflection', value: 1 },
            { source: 'Refraction', target: 'Apparent Depth', value: 1 },
            { source: 'Normal Line', target: 'Angle of Incidence', value: 1 },
            { source: 'Normal Line', target: 'Angle of Refraction', value: 1 }
        ];

        

        let graphInitialized = false;
        function initD3Graph() {
            if (graphInitialized) return;
            graphInitialized = true;

            const svg = d3.select("#graph-svg");
            const tooltip = d3.select("#tooltip");
            const container = document.getElementById('graph-container');
            const width = container.clientWidth;
            const height = 500;

            const simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id).distance(120))
                .force("charge", d3.forceManyBody().strength(-600))
                .force("center", d3.forceCenter(width / 2, height / 2));

            const link = svg.append("g")
                .selectAll("line")
                .data(links)
                .enter().append("line")
                .attr("class", "link");

            const node = svg.append("g")
                .selectAll("g")
                .data(nodes)
                .enter().append("g")
                .attr("class", "node")
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended))
                .on("mouseover", (event, d) => {
                    tooltip.style("display", "block")
                           .html(`<strong>${d.id}</strong><br/>${d.desc}`);
                })
                .on("mousemove", (event) => {
                    const rect = container.getBoundingClientRect();
                    tooltip.style("left", (event.clientX - rect.left + 15) + "px")
                           .style("top", (event.clientY - rect.top + 15) + "px");
                })
                .on("mouseout", () => tooltip.style("display", "none"));

            node.append("circle")
                .attr("r", d => d.group === 1 ? 32 : 24)
                .attr("fill", d => {
                    if (d.group === 1) return "var(--dark-blue)";
                    if (d.group === 2) return "var(--cyan)";
                    if (d.group === 3) return "var(--orange)";
                    return "var(--orange-light)";
                });

            node.append("text")
                .attr("dy", 45)
                .attr("text-anchor", "middle")
                .text(d => d.id);

            simulation.on("tick", () => {
                link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
                node.attr("transform", d => `translate(${d.x},${d.y})`);
            });

            function dragstarted(event, d) { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
            function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
            function dragended(event, d) { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }
        }

      const flashcards = [
            { q: "What happens when light enters a denser medium?", a: "It slows down and bends towards the normal line." },
            { q: "Define the Critical Angle.", a: "The angle of incidence that results in a 90° refracted angle." },
            { q: "Under what conditions does T.I.R. occur?", a: "Light travels from denser to rarer medium and incident angle > critical angle." },
            { q: "How is Refractive Index (n) calculated?", a: "n = Speed of light in vacuum / Speed of light in medium." },
            { q: "What is Refraction?", a: "The bending of light as it passes from one medium to another of different optical density." },
            { q: "Light moving: Air → Glass", a: "It slows down and bends TOWARDS the normal line." },
            { q: "Light moving: Water → Air", a: "It speeds up and bends AWAY from the normal line." },
            { q: "Total Internal Reflection Requirement", a: "1. Light travels from denser to less dense. 2. Angle of incidence > Critical angle." },
            { q: "Refractive Index formula", a: "$n = c/v$ (Speed in vacuum / Speed in medium)" },
            { q: "Apparent Depth", a: "The optical illusion where underwater objects look closer to the surface than they really are." }
        ];
        let currentIdx = 0;

        function updateFlashcard() {
            const card = flashcards[currentIdx];
            const content = document.getElementById('card-inner-content');
            document.getElementById('current-card').classList.remove('flipped');
            
            content.innerHTML = `
                <div class="flashcard-front">
                    <div class="fc-tag">Question</div>
                    <div class="fc-content">${card.q}</div>
                    <div class="fc-hint">Click card to see answer</div>
                </div>
                <div class="flashcard-back">
                    <div class="fc-tag">Answer</div>
                    <div class="fc-content">${card.a}</div>
                </div>
            `;
            document.getElementById('fc-counter').innerText = `${currentIdx + 1} / ${flashcards.length}`;
        }

        function nextCard() { currentIdx = (currentIdx + 1) % flashcards.length; updateFlashcard(); }
        function prevCard() { currentIdx = (currentIdx - 1 + flashcards.length) % flashcards.length; updateFlashcard(); }


       const questions = [
            { q: "When light travels from air into a glass block, it:", opts: ["Speeds up", "Bends away from the normal", "Bends towards the normal", "Keeps the same speed"], correct: 2 },
            { q: "Total Internal Reflection can only occur when light travels from:", opts: ["Less dense to more dense", "More dense to less dense", "Air to Water", "Vacuum to Glass"], correct: 1 },
            { q: "The ratio $n = \\sin i / \\sin r$ is known as:", opts: ["Newton's Law", "Snell's Law", "Einstein's Equation", "Critical Angle Law"], correct: 1 }
        ];
        let curQ = 0;

        function renderQuiz() {
            const body = document.getElementById('quiz-body');
            const q = questions[curQ];
             body.innerHTML = `
                <p style="font-weight: 600; margin-bottom: 20px;">Question ${curQ + 1} of ${questions.length}:</p>
                <p style="font-size: 1.1rem; margin-bottom: 25px;">${q.q}</p>
                <div class="options">${q.opts.map((o,i) => `<button class="option-btn" onclick="checkQ(${i})">${o}</button>`).join('')}</div>`;
        }

        function checkQ(idx) {
            const fb = document.getElementById('quiz-feedback');
            fb.style.display = 'block';
            if(idx === questions[curQ].correct) {
                fb.innerHTML = "✅ Correct!"; fb.style.background = "#dcfce7"; fb.style.color = "#166534";
            } else {
                fb.innerHTML = "❌ Incorrect. Light bends towards the normal in denser media."; fb.style.background = "#fee2e2"; fb.style.color = "#991b1b";
            }
            setTimeout(() => { curQ = (curQ + 1) % questions.length; renderQuiz(); fb.style.display='none'; }, 2000);
        }

        window.onload = () => { updateFlashcard(); renderQuiz(); };
    </script>
</body>
</html>
