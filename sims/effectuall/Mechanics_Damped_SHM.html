  function translateString(str) {
    if (!str || typeof str !== 'string') return str;
    let out = str;
    for (const [en, uz] of PHRASES) {
      if (out.includes(en)) {
        out = out.split(en).join(uz);
      } else {
        const re = new RegExp(en.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        if (re.test(out)) out = out.replace(re, uz);
      }
    }
    // Single-word whole-token replacements for common labels
    out = out.replace(/\b([A-Za-z][A-Za-z\s\/]{1,22})\b/g, (m) => {
      const upper = m.trim().toUpperCase();
      if (WORDS.has(upper)) return WORDS.get(upper);
      return m;
    });
    return out;
  }

  let translating = false;
  function translateDOM(root) {
    if (translating || !root) return;
    translating = true;
    try {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      let node;
      while ((node = walker.nextNode())) {
        const parent = node.parentElement;
        if (!parent) continue;
        const tag = parent.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'CODE' || parent.closest('.atomix-skip-translate')) continue;
        const orig = node.nodeValue;
        if (!orig || !/[A-Za-z]{2,}/.test(orig)) continue;
        const next = translateString(orig);
        if (next !== orig) node.nodeValue = next;
      }

      // Wire theory button if present
      const theoryBtn = document.getElementById('theorybutton');
      if (theoryBtn && !theoryBtn.dataset.atomixWired) {

        };
      }
    } finally {
      translating = false;
    }
  }

  function initBridge() {
    if (!document.body) return;
    translateDOM(document.body);

    // Keep anchor links (#section) inside the local localized page instead of following <base href>
    document.addEventListener('click', (e) => {
      const a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
      if (!a) return;
      const hash = a.getAttribute('href');
      if (hash && hash.length > 1) {
        const target = document.getElementById(hash.slice(1));
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth' });
        }
      }
    });

    const observer = new MutationObserver((mutations) => {
      if (translating) return;
      for (const m of mutations) {
        for (const n of m.addedNodes) {
          if (n.nodeType === 1) translateDOM(n);
          else if (n.nodeType === 3 && n.parentElement) translateDOM(n.parentElement);
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true, characterData: false });

    // Periodic light pass for dynamic table/lil-gui text mutations
    setInterval(() => translateDOM(document.body), 900);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initBridge);
  } else {
    initBridge();
  }
})();

                <span id="dampCoeff-val" class="text-red-600 text-lg font-mono">0.10</span>
            </div>

        </div>
    </div>

    <script>
        // --- FIREBASE AND THREE.JS SETUP (Minimal) ---

        // Define dummy params needed by pendulumEquation
        let params = {
            g: 9.81, // Gravity
            len: 100, // Pendulum length in cm
            amp: 1.0, // Initial amplitude (angle in radians)
            dampCoeff: 0.1, // Damping coefficient (gamma)
            startTime: Date.now() / 1000,
        };

        // Define the scale factor: 1 cm in physics = 0.5 unit in 3D scene
        const SCALE_FACTOR = 0.5;
        const PIVOT_Y_POS = 0; // Y-position for the pivot point

        // Global THREE.js variables
        let scene, camera, renderer, pendulumBob, pendulumRod, controls, labelRenderer, lengthLabel;
        let pivotVisual, pendulumGroup; // Added pendulumGroup for rotation control
        const canvasContainer = document.getElementById('canvas-container');
        const { CSS2DRenderer, CSS2DObject } = THREE; // Destructure CSS2D classes

        // --- UTILITY FUNCTIONS ---

        /**
         * Calculates the natural angular frequency (w) and period (T) for a simple pendulum.
         */
        function pendulumEquation() {
            // Convert length from cm to meters (divide by 100)
            let w = Math.sqrt(params.g / (params.len * 0.01));
            let T = 2 * Math.PI / w;

            return { T, w };
        }

        /**
         * Calculates the angular displacement (theta) for a DAMPED pendulum.
         */
        function getDampedAngle(t, amp, dampCoeff) {
            // Calculate natural frequency (w0) based on current length
            const w0 = pendulumEquation().w;

            // Exponential Decay Term (e^(-gamma*t))
            const decay = Math.exp(-dampCoeff * t);

            // Cosine Oscillation Term (cos(w0*t))
            const oscillation = Math.cos(w0 * t);

            // Combined Damped Angular Displacement (theta)
            const angle = amp * decay * oscillation;

            return angle;
        }

        // --- THREE.JS SIMULATION LOGIC ---

        /**
         * Updates the rod and bob geometry/position when the length parameter changes.
         * This function is called in init() and when the length slider changes.
         * @param {number} newLen - The new length in cm.
         */
        function updatePendulumLength(newLen) {
            // 1. Calculate scaled dimensions
            const L_scaled = newLen * SCALE_FACTOR;
            const rodHeight = L_scaled * 2; // Rod geometry height must be the full length

            // 2. Handle Rod (Recreate geometry since dimensions are immutable)
            if (pendulumRod) {
                pendulumGroup.remove(pendulumRod);
            }
            const rodGeometry = new THREE.CylinderGeometry(0.5, 0.5, rodHeight, 32);
            const rodMaterial = new THREE.MeshBasicMaterial({ color: 0x4b5563 });
            pendulumRod = new THREE.Mesh(rodGeometry, rodMaterial);

            // Position rod center at -rodHeight/2 so the top edge is at the group's origin (the pivot)
            pendulumRod.position.y = -rodHeight / 2;
            pendulumGroup.add(pendulumRod);

            // 3. Reposition Bob
            // The bob should be at the bottom of the rod, which is -rodHeight from the group origin
            pendulumBob.position.y = -rodHeight;

            // 4. Update Rod dimensions/scale in the scene
            params.len = newLen;
        }

        function init() {
            // Use window dimensions for full screen
            const width = window.innerWidth;
            const height = window.innerHeight;

            // 1. WebGL Renderer Setup (for 3D objects)
            renderer = new THREE.WebGLRenderer({ antialias: true, canvas: document.createElement('canvas') });
            renderer.setSize(width, height);
            renderer.setClearColor(0x1f2937);
            canvasContainer.appendChild(renderer.domElement);

            // 2. CSS2D Renderer Setup (for HTML labels)
            labelRenderer = new CSS2DRenderer();
            labelRenderer.setSize(width, height);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0px';
            labelRenderer.domElement.style.pointerEvents = 'none'; // Allow clicking through to the canvas
            canvasContainer.appendChild(labelRenderer.domElement);

            // Scene Setup
            scene = new THREE.Scene();

            // 3. Camera Setup (Front-facing)
            camera = new THREE.PerspectiveCamera(
                75, // FOV
                width / height, // Aspect Ratio
                0.1, // Near
                1000 // Far
            );
            // Camera position is front-facing (X=0, looking along Z)
            camera.position.set(0, PIVOT_Y_POS, 80);
            camera.lookAt(0, PIVOT_Y_POS, 0);

            // 4. Orbit Controls Setup
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.set(0, -35 + PIVOT_Y_POS, 0); // Focus on the pivot point
            controls.update(); // Initial update

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1, 100);
            pointLight.position.set(20, 30, 50);
            scene.add(pointLight);

            // --- Pendulum Components ---

            // A. Pivot Point (Visual sphere, static)
            const pivotGeometry = new THREE.SphereGeometry(2, 32, 32);
            const pivotMaterial = new THREE.MeshPhongMaterial({ color: 0xcccccc });
            pivotVisual = new THREE.Mesh(pivotGeometry, pivotMaterial);
            pivotVisual.position.set(0, PIVOT_Y_POS, 0); // Static location
            scene.add(pivotVisual);

            // B. Pendulum Group (The object that rotates)
            pendulumGroup = new THREE.Group();
            pendulumGroup.position.set(0, PIVOT_Y_POS, 0); // Set the rotation origin to the pivot point
            scene.add(pendulumGroup);

            // C. Initial Bob setup (required globally before updatePendulumLength)
            const bobGeometry = new THREE.SphereGeometry(4, 32, 32);
            const bobMaterial = new THREE.MeshPhongMaterial({ color: 0xef4444, shininess: 80 });
            pendulumBob = new THREE.Mesh(bobGeometry, bobMaterial);
            pendulumGroup.add(pendulumBob); // Add to group, position will be set by updatePendulumLength

            // D. Initial Rod setup (required globally before updatePendulumLength)
            // Note: pendulumRod is initialized here, but its geometry/position is set in updatePendulumLength
            pendulumRod = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1, 32), new THREE.MeshBasicMaterial({ color: 0x4b5563 }));
            pendulumGroup.add(pendulumRod);

            // E. Length Label Creation
            const lengthDiv = document.createElement('div');
            lengthDiv.className = 'length-label';
            lengthDiv.textContent = `L: ${params.len} cm`;

            lengthLabel = new CSS2DObject(lengthDiv);
            lengthLabel.position.set(-10, PIVOT_Y_POS, 0); // Position slightly away from the rod 
            pivotVisual.add(lengthLabel); // Attach label to the static pivot visual

            // Set initial geometry and position based on current params.len
            updatePendulumLength(params.len);
            updatePendulum(params.amp); // Set initial rotation

            // Handle window resizing
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            renderer.setSize(width, height);
            labelRenderer.setSize(width, height); // Resize CSS2D Renderer

            // Update Perspective Camera aspect ratio
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        }


        /**
         * Updates the rotation of the pendulum group based on the current angle.
         * All children (rod, bob) rotate automatically.
         * @param {number} theta - The angular displacement in radians.
         */
        function updatePendulum(theta) {
            // 1. Update Length Label text (This stays the same)
            if (lengthLabel) {
                lengthLabel.element.textContent = `L: ${params.len} cm`;
            }

            // 2. Apply rotation directly to the parent group
            pendulumGroup.rotation.z = theta;
        }

        function animate() {
            requestAnimationFrame(animate);

            const currentTime = Date.now() / 1000;
            const t = currentTime - params.startTime;

            // Get the current damped angle
            const currentAngle = getDampedAngle(t, params.amp, params.dampCoeff);

            // Update the rotation and label text
            updatePendulum(currentAngle);

            // Update Orbit Controls
            controls.update();

            // Render both the 3D scene and the HTML labels
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // --- UI CONTROLS AND EVENT LISTENERS ---

        document.addEventListener('DOMContentLoaded', () => {
            // Get elements
            const lengthInput = document.getElementById('length');
            const amplitudeInput = document.getElementById('amplitude');
            const dampCoeffInput = document.getElementById('dampCoeff');
            const lengthVal = document.getElementById('length-val');
            const amplitudeVal = document.getElementById('amplitude-val');
            const dampCoeffVal = document.getElementById('dampCoeff-val');

            // Initial update of display values
            lengthVal.textContent = params.len;
            amplitudeVal.textContent = params.amp.toFixed(2);
            dampCoeffVal.textContent = params.dampCoeff.toFixed(2);

            // Function to restart the simulation with new parameters
            const restartSimulation = () => {
                // Reset start time to measure t from zero again
                params.startTime = Date.now() / 1000;
            };

            // Event listeners for UI updates
            lengthInput.addEventListener('input', (e) => {
                const newLen = parseFloat(e.target.value);
                lengthVal.textContent = newLen;
                updatePendulumLength(newLen); // <--- Call new length update function
                restartSimulation();
            });

            amplitudeInput.addEventListener('input', (e) => {
                params.amp = parseFloat(e.target.value);
                amplitudeVal.textContent = params.amp.toFixed(2);
                restartSimulation();
            });

            dampCoeffInput.addEventListener('input', (e) => {
                params.dampCoeff = parseFloat(e.target.value);
                dampCoeffVal.textContent = params.dampCoeff.toFixed(2);
                restartSimulation();
            });

            // Start the Three.js visualization
            init();
            animate();

            // Initial resizing for correct camera setup
            onWindowResize();
        });

        // --- Placeholder for original functions not used in the 3D logic but included for context ---

        function valueCal(len, amp) {
            let data = [], dataX = [], dataY = [], dataV = [], points = [];
            let period = pendulumEquation().w;

            for (let i = 0; i < (10); i += 0.002) {
                let t = i;
                let wt = t * period;
                // SHM Angle: a = amp * cos(wt)
                let a = amp * (Math.cos(wt));
                // Position (using SHM angle 'a')
                let b = (len * Math.sin(a)).toFixed(2);
                let c = (len * Math.cos(a)).toFixed(2);
                // SHM Angular Velocity: v = -A * w * sin(wt)
                let v = -amp * period * Math.sin(wt);
                // points.push(new THREE.Vector3(b, -10, -i * 5)); 
                data.push(a);
                dataX.push(c);
                dataY.push(b);
                dataV.push(v);
            }
            console.log("SHM Data Trace Generated (Angular Displacement, X Pos, Y Pos, Velocity)");
        }

    </script>
</body>
