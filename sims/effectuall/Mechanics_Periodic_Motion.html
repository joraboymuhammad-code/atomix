  function translateString(str) {
    if (!str || typeof str !== 'string') return str;
    let out = str;
    for (const [en, uz] of PHRASES) {
      if (out.includes(en)) {
        out = out.split(en).join(uz);
      } else {
        const re = new RegExp(en.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        if (re.test(out)) out = out.replace(re, uz);
      }
    }
    // Single-word whole-token replacements for common labels
    out = out.replace(/\b([A-Za-z][A-Za-z\s\/]{1,22})\b/g, (m) => {
      const upper = m.trim().toUpperCase();
      if (WORDS.has(upper)) return WORDS.get(upper);
      return m;
    });
    return out;
  }

  let translating = false;
  function translateDOM(root) {
    if (translating || !root) return;
    translating = true;
    try {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      let node;
      while ((node = walker.nextNode())) {
        const parent = node.parentElement;
        if (!parent) continue;
        const tag = parent.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'CODE' || parent.closest('.atomix-skip-translate')) continue;
        const orig = node.nodeValue;
        if (!orig || !/[A-Za-z]{2,}/.test(orig)) continue;
        const next = translateString(orig);
        if (next !== orig) node.nodeValue = next;
      }

      // Wire theory button if present
      const theoryBtn = document.getElementById('theorybutton');
      if (theoryBtn && !theoryBtn.dataset.atomixWired) {

        };
      }
    } finally {
      translating = false;
    }
  }

  function initBridge() {
    if (!document.body) return;
    translateDOM(document.body);

    // Keep anchor links (#section) inside the local localized page instead of following <base href>
    document.addEventListener('click', (e) => {
      const a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
      if (!a) return;
      const hash = a.getAttribute('href');
      if (hash && hash.length > 1) {
        const target = document.getElementById(hash.slice(1));
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth' });
        }
      }
    });

    const observer = new MutationObserver((mutations) => {
      if (translating) return;
      for (const m of mutations) {
        for (const n of m.addedNodes) {
          if (n.nodeType === 1) translateDOM(n);
          else if (n.nodeType === 3 && n.parentElement) translateDOM(n.parentElement);
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true, characterData: false });

    // Periodic light pass for dynamic table/lil-gui text mutations
    setInterval(() => translateDOM(document.body), 900);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initBridge);
  } else {
    initBridge();
  }
})();

		}

		function init() {
			camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
			camera.position.set(0, 32, 37);

			scene = new THREE.Scene();
			scene.background = new THREE.Color('skyblue');
			scene.fog = new THREE.Fog(0x222244, 50, 100);
			periodicScene();
			renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setPixelRatio(window.devicePixelRatio);
			renderer.setSize(window.innerWidth, window.innerHeight);
			renderer.shadowMap.enabled = true;
			renderer.shadowMap.type = THREE.VSMShadowMap;
			// renderer.shadowMap.type = THREE.BasicShadowMap;
			document.body.appendChild(renderer.domElement);
			clock = new THREE.Clock();
			scene.add(group)
			// Mouse control
			const controls = new OrbitControls(camera, renderer.domElement);
			controls.target.set(0, 2, 0);
			controls.update();
			window.addEventListener('resize', onWindowResize);
			periodicProjection()
		}

		function periodicProjection() {
			const delta = clock.getDelta();
			ring.rotation.y += params.freq * params.time;
			if (t < 18) {
				nextPoint = new THREE.Vector3(params.pos * Math.cos(ring.rotation.y), 0, t + 2);
				// console.log( delta, params.time)
				line = initLine({
					points: [presentPoint, nextPoint],
					lineMaterial: new THREE.LineBasicMaterial({ color: "rgb(100%, 0%, 0%)" }),
					yRotation: 0,
					x: 0,
					y: 0,
					z: 0
				});
				presentPoint = nextPoint;
				group.add(line)
			}

			t += params.time;
			requestID = requestAnimationFrame(periodicProjection)
		}

		function periodicScene() {

			// Lights

			scene.add(new THREE.AmbientLight(0xffffff, 0.6));
			let dirLight = new THREE.DirectionalLight(0xffffff);
			dirLight.position.set(0, 25, 0);
			dirLight.castShadow = true;
			dirLight.shadow.camera.near = 0.1;
			dirLight.shadow.camera.far = 500;
			dirLight.shadow.camera.right = 17;
			dirLight.shadow.camera.left = - 17;
			dirLight.shadow.camera.top = 17;
			dirLight.shadow.camera.bottom = - 17;
			dirLight.shadow.mapSize.width = 512;
			dirLight.shadow.mapSize.height = 512;
			dirLight.shadow.radius = 3;
			dirLight.shadow.bias = - 0.0005;

			dirGroup = new THREE.Group();
			dirGroup.add(dirLight);
			scene.add(dirGroup);

			// Geometry

			const geometry = new THREE.SphereGeometry(0.5, 16, 24);
			const material = new THREE.MeshPhongMaterial({
				color: 0xff0000,
				shininess: 0,
				specular: 0x222222
			});

			sphere = new THREE.Mesh(geometry, material);
			sphere.position.x = params.pos;
			sphere.castShadow = true;
			sphere.receiveShadow = true;

			const cylinderGeometry = new THREE.CylinderGeometry(10, 10, 0.5, 32).translate(0, -0.5, 0);
			const material1 = new THREE.MeshPhongMaterial({
				color: 0x0000f3,
				shininess: 0,
				specular: 0x00ee22
			});
			ring = new THREE.Mesh(cylinderGeometry, material1);
			ring.rotation.set(1.57, 0, 0);
			ring.position.set(0, 10, 0);
			ring.castShadow = true;
			ring.receiveShadow = true;;

			scene.add(ring);
			ring.add(sphere);
			let centralGeometry = new THREE.CylinderGeometry(.2, .2, 0.5, 3);
			let centralPos = new THREE.Mesh(centralGeometry, material);
			centralPos.rotation.set(1.57, 0, 0);
			centralPos.position.y = 10;
			centralPos.castShadow = true;
			centralPos.receiveShadow = true;
			scene.add(centralPos)
			const planeGeometry = new THREE.PlaneGeometry(50, 50).translate(0, 0, -2);
			const planeMaterial = new THREE.MeshPhongMaterial({
				color: 'grey',
				shininess: 0,
				specular: 0x111111
			});

			const ground = new THREE.Mesh(planeGeometry, planeMaterial);
			ground.rotation.x = - Math.PI / 2;
			ground.castShadow = true;
			ground.receiveShadow = true;
			scene.add(ground);

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize(window.innerWidth, window.innerHeight);

		}

		function animate() {

			requestAnimationFrame(animate);
			renderer.render(scene, camera);

		}

		function initLine(data) {
			let lineGeometry = new THREE.BufferGeometry().setFromPoints(data.points);
			line = new THREE.Line(lineGeometry, data.lineMaterial);

			line.rotation.y = data.yRotation;
			line.position.x = data.x;
			line.position.y = data.y;
			line.position.z = data.z;
			return line;
		}
	</script>
</body>

</html>
