  function translateString(str) {
    if (!str || typeof str !== 'string') return str;
    let out = str;
    for (const [en, uz] of PHRASES) {
      if (out.includes(en)) {
        out = out.split(en).join(uz);
      } else {
        const re = new RegExp(en.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        if (re.test(out)) out = out.replace(re, uz);
      }
    }
    // Single-word whole-token replacements for common labels
    out = out.replace(/\b([A-Za-z][A-Za-z\s\/]{1,22})\b/g, (m) => {
      const upper = m.trim().toUpperCase();
      if (WORDS.has(upper)) return WORDS.get(upper);
      return m;
    });
    return out;
  }

  let translating = false;
  function translateDOM(root) {
    if (translating || !root) return;
    translating = true;
    try {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      let node;
      while ((node = walker.nextNode())) {
        const parent = node.parentElement;
        if (!parent) continue;
        const tag = parent.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'CODE' || parent.closest('.atomix-skip-translate')) continue;
        const orig = node.nodeValue;
        if (!orig || !/[A-Za-z]{2,}/.test(orig)) continue;
        const next = translateString(orig);
        if (next !== orig) node.nodeValue = next;
      }

      // Wire theory button if present
      const theoryBtn = document.getElementById('theorybutton');
      if (theoryBtn && !theoryBtn.dataset.atomixWired) {
        theoryBtn.dataset.atomixWired = '1';
        theoryBtn.textContent = 'NAZARIYA (1-PUNKT)';
        theoryBtn.onclick = function (e) {

          window.theorySite();
        };
      }
    } finally {
      translating = false;
    }
  }

  function initBridge() {
    if (!document.body) return;
    translateDOM(document.body);

    // Keep anchor links (#section) inside the local localized page instead of following <base href>
    document.addEventListener('click', (e) => {
      const a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
      if (!a) return;
      const hash = a.getAttribute('href');
      if (hash && hash.length > 1) {
        const target = document.getElementById(hash.slice(1));
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth' });
        }
      }
    });

    const observer = new MutationObserver((mutations) => {
      if (translating) return;
      for (const m of mutations) {
        for (const n of m.addedNodes) {
          if (n.nodeType === 1) translateDOM(n);
          else if (n.nodeType === 3 && n.parentElement) translateDOM(n.parentElement);
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true, characterData: false });

    // Periodic light pass for dynamic table/lil-gui text mutations
    setInterval(() => translateDOM(document.body), 900);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initBridge);
  } else {
    initBridge();
  }
})();

            let mesh = new THREE.Mesh(geometry, material);

        }

        function pointerMove() {
            pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
            pointer.y = - (event.clientY / window.innerHeight) * 2 + 1;

        }

        function onClick(event) {
            event.preventDefault();
            pointerMove()
            raycaster.setFromCamera(pointer, camera);
            let intersects = raycaster.intersectObjects(objects, true);
            if (intersects.length > 0) {

                SELECTED = intersects[0].object;// electronButton, gunLabel
                if (SELECTED == gunLabel || SELECTED == electronButton || SELECTED == electronTube) {

                if (SELECTED == voltLabel || SELECTED == voltButton) {

                topMaterial.map = new THREE.CanvasTexture(posCanvas);

        function gunAction() {

                buttonSwitch.innerHTML = "ON"
                gunLabel.material.map = onTexture
                electronButton.position.set(1.1, 0, 0)
                electronButton.material = greenMaterial
                points = []
                t = 0;
                addPath()
                LINES.visible = true;
            } else if (!power) {

                gunLabel.material.map = offTexture

                electronButton.material = redMaterial

            }
        }

        function addPath() {
            while (LINES.children.length > 0) {
                const A = LINES.children[0];
                A.parent.remove(A);
            }
            let vertices = [];
            // let points = [];
            const point = new THREE.Vector3();
            const color = new THREE.Color();
            for (let i = 0; i < 33; i = i + 0.1) {
                // let v = new THREE.Vector3(-13 + 12 * i, -(i * i), 0)
                // points.push(v)
                //parabola Ax^2 - By^2 = C new THREE.Vector3(Math.pow(((i * i) + 13), (i * i), 0.5), 0) 
                // new THREE.Vector3(r * Math.cos(i * theta), r * Math.sin(i * theta), 0).add(new THREE.Vector3(b, 0, 0)) new THREE.Vector3(-13 + i, 0, 0)
                let v = new THREE.Vector3(15 - i, 0, 0)
                points.push(v)


            }
            const geometry = new THREE.BufferGeometry();

            let colors = [];

            for (let i = 0; i < points.length; i++) {

                const point = points[i];
                vertices.push(point.x, point.y, point.z);
                color.setHSL(1, 1, Math.max(0, (20 - points[i].x) / 20) * 0.5, THREE.SRGBColorSpace);
                colors.push(color.r, color.g, color.b);

            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            const material = new THREE.LineBasicMaterial({ color: 0xffffff, vertexColors: true });

            let line, p;
            const scale = 0.7, d = 0;

            const parameters = [
                [material, scale * 1.5, [0, 0, 0], geometry],

            ];

            for (let i = 0; i < parameters.length; i++) {

                p = parameters[i];
                line = new THREE.Line(p[3], p[0]);
                line.scale.x = line.scale.y = line.scale.z = p[1];
                line.position.x = p[2][0];
                line.position.y = p[2][1];
                line.position.z = p[2][2];
                scene.add(line);

            }
            LINES.add(line);
        }

        function createCamera(x, y, z) {

            let fov = 55;
            const aspect = window.innerWidth / window.innerHeight;
            const near = 0.1;
            const far = 1500;

            camera = new THREE.PerspectiveCamera(fov, aspect, near, far);

            camera.position.set(x, y, z);
        }

        function createControls(x, y, z) {
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enablePan = true;
            controls.enableZoom = true;
            controls.target.set(x, y, z);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.1;
            controls.update();
            controls.addEventListener('change', render);
        }

        function createRenderer() {
            // create the renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.alpha = true;
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.body.appendChild(renderer.domElement);

        }

        function createLights() {
            let hemiLight = new THREE.AmbientLight(0xffffff, .20);
            hemiLight.position.set(0, 20, 0);
            scene.add(hemiLight);

            let dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(0, 10, 0);
            dirLight.castShadow = true;
            dirLight.shadow.camera.top = 70;
            dirLight.shadow.camera.bottom = -70;
            dirLight.shadow.camera.left = -70
            dirLight.shadow.camera.right = 70;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            scene.add(new THREE.AmbientLight(0xffffff, .4));
        }

        function onWindowResize() {

            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);

        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update()
            render();

        }

        function render() {
            renderer.render(scene, camera);
        }

        function guiControls() {
            let gui = new GUI();
            gui.close()


            gui.add(camera.position, 'x', -100, 100);
            gui.add(camera.position, 'y', -100, 100);
            gui.add(camera.position, 'z', -100, 100);
            let controlFolder = gui.addFolder("Control");
            controlFolder.add(controls.target, 'x', -100, 100);
            controlFolder.add(controls.target, 'y', -100, 100);
            controlFolder.add(controls.target, 'z', -100, 100);

        function makeLabelCanvas(size, name, backgdCol, color) {
            const borderSize = 2;
            const ctx = document.createElement('canvas').getContext('2d');
            const font = `${size}px bold sans-serif`;
            ctx.font = font;
            // measure how long the name will be
            const doubleBorderSize = borderSize * 2;
            const width = ctx.measureText(name).width + doubleBorderSize;
            const height = size + doubleBorderSize;
            ctx.canvas.width = width;
            ctx.canvas.height = height;

            // need to set font again after resizing canvas
            ctx.font = font;
            ctx.textBaseline = 'top';

            ctx.fillStyle = backgdCol;
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = color;
            ctx.fillText(name, borderSize, borderSize);

            return ctx.canvas;
        }

        function makeText(x, y, z, size, material, name, backgdCol, color) {
            const canvas = makeLabelCanvas(size, name, backgdCol, color);
            material.map = new THREE.CanvasTexture(canvas);

            const root = new THREE.Object3D();
            root.position.set(x, y, z);

            const label = new THREE.Mesh(labelGeometry, material);
            root.add(label);
            const labelBaseScale = 0.01;
            label.scale.x = canvas.width * labelBaseScale;
            label.scale.y = canvas.height * labelBaseScale;

            scene.add(root);
            return root;
        }


        function generateTexture() {

            const canvas = document.createElement('canvas');
            canvas.width = 2;
            canvas.height = 2;

            const context = canvas.getContext('2d');
            context.fillStyle = 'white';
            context.fillRect(0, 1, 2, 1);

            return canvas;

        }
