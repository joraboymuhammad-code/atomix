  function translateString(str) {
    if (!str || typeof str !== 'string') return str;
    let out = str;
    for (const [en, uz] of PHRASES) {
      if (out.includes(en)) {
        out = out.split(en).join(uz);
      } else {
        const re = new RegExp(en.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        if (re.test(out)) out = out.replace(re, uz);
      }
    }
    // Single-word whole-token replacements for common labels
    out = out.replace(/\b([A-Za-z][A-Za-z\s\/]{1,22})\b/g, (m) => {
      const upper = m.trim().toUpperCase();
      if (WORDS.has(upper)) return WORDS.get(upper);
      return m;
    });
    return out;
  }

  let translating = false;
  function translateDOM(root) {
    if (translating || !root) return;
    translating = true;
    try {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      let node;
      while ((node = walker.nextNode())) {
        const parent = node.parentElement;
        if (!parent) continue;
        const tag = parent.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'CODE' || parent.closest('.atomix-skip-translate')) continue;
        const orig = node.nodeValue;
        if (!orig || !/[A-Za-z]{2,}/.test(orig)) continue;
        const next = translateString(orig);
        if (next !== orig) node.nodeValue = next;
      }

      // Wire theory button if present
      const theoryBtn = document.getElementById('theorybutton');
      if (theoryBtn && !theoryBtn.dataset.atomixWired) {
        theoryBtn.dataset.atomixWired = '1';
        theoryBtn.textContent = 'NAZARIYA (1-PUNKT)';
        theoryBtn.onclick = function (e) {
          e.preventDefault();
          window.theorySite();
        };
      }
    } finally {
      translating = false;
    }
  }

  function initBridge() {
    if (!document.body) return;
    translateDOM(document.body);

    // Keep anchor links (#section) inside the local localized page instead of following <base href>
    document.addEventListener('click', (e) => {
      const a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
      if (!a) return;
      const hash = a.getAttribute('href');
      if (hash && hash.length > 1) {
        const target = document.getElementById(hash.slice(1));
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth' });
        }
      }
    });

    const observer = new MutationObserver((mutations) => {
      if (translating) return;
      for (const m of mutations) {
        for (const n of m.addedNodes) {
          if (n.nodeType === 1) translateDOM(n);
          else if (n.nodeType === 3 && n.parentElement) translateDOM(n.parentElement);
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true, characterData: false });

    // Periodic light pass for dynamic table/lil-gui text mutations
    setInterval(() => translateDOM(document.body), 900);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initBridge);
  } else {
    initBridge();
  }
})();

            });
            renderer.alpha = true;
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

        }

        function init() {
            scene = new THREE.Scene();
            scene.add(atom, arrows, POINTS)

            createCamera();
            createRenderer();
            createControls(0, 0, 0);
            hydrogenAtom();
            atom.position.set(0, 0, 0);
            buttonActions();
            addPoints();
            window.addEventListener('resize', onWindowResize);
            scene.add(labels, arrows)
            labels.visible = false;
            arrows.visible = false;
            POINTS.visible = false;
        }//add obbiting feature too

        window.onload = function () {
            init();
            animate();
            // guiControls();
            planetMovement()
        }

        function addPoints() {

            let a = 27, b = 22;
            for (let i = 0.02; i < Math.PI; i = i + 0.05) {
                const vertices = [];
                for (let j = 0.04; j < 2 * Math.PI; j = j + 0.05) {
                    let r = Math.random() * (a - b) + a
                    const x = (Math.random() * (a - b) + a) * Math.sin(j);
                    const y = (Math.random() * (a - b) + a) * Math.cos(j);

                    vertices.push(x, y, 0);

                }
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                const material = new THREE.PointsMaterial({ color: 0x888888, size: 0.5 });
                const points = new THREE.Points(geometry, material);
                points.rotation.set(0, i, 0)
                POINTS.add(points);
            }
        }

        function buttonActions() {
            changeEl.addEventListener('click', () => {
                isChanged = !isChanged;
                if (isChanged) {
                    atom.position.set(0, -40, 0);
                    orbit.position.set(0, -40, 0);
                    POINTS.position.set(0, -40, 0);
                    hydrogenLevels()

                    labels.visible = true;
                    arrows.visible = true;
                } else {
                    atom.position.set(0, 0, 0);
                    hydrogenLevels()
                    orbit.position.set(0, 0, 0);
                    POINTS.position.set(0, 0, 0);
                    labels.visible = false;
                    arrows.visible = false;
                }
            })

            quantumEl.addEventListener('click', () => {
                isQuantum = !isQuantum;
                if (isQuantum) {
                    POINTS.visible = true;
                    electron.visible = false;
                    orbit.visible = false;
                    cancelAnimationFrame(requestID)
                } else {
                    POINTS.visible = false;
                    electron.visible = true;
                    orbit.visible = true;
                    planetMovement()
                }
            })
        }

        function hydrogenLevels() {
            let levels = [
                { n: 1, l: 0, m: 0, name: "1s" },
                { n: 2, l: 0, m: 0, name: "2s" },
                { n: 2, l: 1, m: 0, name: "2p" },
                { n: 3, l: 0, m: 0, name: "3s" },
                { n: 3, l: 1, m: 0, name: "3p" },
                { n: 3, l: 2, m: 0, name: "3d" },
                { n: 4, l: 0, m: 0, name: "4s" },
                { n: 4, l: 1, m: 0, name: "4p" },
                { n: 4, l: 2, m: 0, name: "4d" },
                { n: 4, l: 3, m: 0, name: "4f" },
                { n: 5, l: 0, m: 0, name: "5s" },
                { n: 5, l: 1, m: 0, name: "5p" },
                { n: 5, l: 2, m: 0, name: "5d" },
                { n: 5, l: 3, m: 0, name: "5f" },
                { n: 6, l: 0, m: 0, name: "6s" },
                { n: 6, l: 1, m: 0, name: "6p" },
                { n: 6, l: 2, m: 0, name: "6d" },
                { n: 7, l: 0, m: 0, name: "7s" },
                { n: 7, l: 1, m: 0, name: "7p" }]
            // console.log(levels[1])
            for (let i = 0; i < levels.length; i++) {
                // let X = addEllipse(10 * levels[i].n, 10 * levels[i].n, 0, 100, "yellow").ellipse;
                // orbit.add(X);
                let filamentMaterial = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, transparent: true });
                labels.add(makeText(10 * levels[i].l, 10 * levels[i].n, 0, 22, filamentMaterial, levels[i].name, "rgba(0, 0, 0, 0.1)", "rgba(0, 255, 255, 1)"))
                let A = new THREE.ArrowHelper(new THREE.Vector3(-1, 1, 0).normalize(), new THREE.Vector3(0, 0, 0), 15, 0xffff00)
                A.position.set(10 * levels[i].l, 10 * levels[i].n, 0)
                arrows.add(A)
            }
            // let filamentMaterial = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, transparent: true });
            // scene.add(new THREE.ArrowHelper(new THREE.Vector3(-1, 1, 0).normalize(), new THREE.Vector3(0, 0, 0), 20, 0xffff00))
        }

        function guiControls() {
            let gui = new GUI();
            gui.close()


            gui.add(camera.position, 'x', -100, 100);
            gui.add(camera.position, 'y', -100, 100);
            gui.add(camera.position, 'z', -100, 100);
            let controlFolder = gui.addFolder("Control");
            controlFolder.add(controls.target, 'x', -100, 100);
            controlFolder.add(controls.target, 'y', -100, 100);
            controlFolder.add(controls.target, 'z', -100, 100);

        }

        function render() {
            renderer.render(scene, camera);
        }

        function onWindowResize() {

            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
            render();

        }

        function addEllipse(r1, r2, rot, N, col) {

            const curve = new THREE.EllipseCurve(
                0, 0,            // ax, aY
                r1, r2,           // xRadius, yRadius
                0, 2 * Math.PI,  // aStartAngle, aEndAngle
                false,            // aClockwise
                rot                // aRotation
            );

            const points = curve.getSpacedPoints(N);
            const geometry = new THREE.BufferGeometry().setFromPoints(points);

            const material = new THREE.LineBasicMaterial({ color: col, linewidth: 2 });

            // Create the final object to add to the scene
            const ellipse = new THREE.Line(geometry, material);

            return { curve, points, ellipse }

        }

        function planetMovement() {
            t = (clock.getElapsedTime() * 0.1) % 1;
            electron.position.copy(curve.getPointAt(t, v));
            electron.position.applyMatrix4(orbit.matrixWorld);
            if (interval > 100) {
                orbit.rotation.x += 0.05;
                orbit.rotation.y += 0.05;
                orbit.rotation.z += 0.05
                interval = 0;
            }
            electron.rotation.y += 0.05;
            requestID = requestAnimationFrame(planetMovement);
            interval++;
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            render();
        }

        function makeLabelCanvas(size, name, backgdCol, color) {
            const borderSize = 2;
            const ctx = document.createElement('canvas').getContext('2d');
            const font = `${size}px bold sans-serif`;
            ctx.font = font;
            // measure how long the name will be
            const doubleBorderSize = borderSize * 2;
            const width = ctx.measureText(name).width + doubleBorderSize;
            const height = size + doubleBorderSize;
            ctx.canvas.width = width;
            ctx.canvas.height = height;

            // need to set font again after resizing canvas
            ctx.font = font;
            ctx.textBaseline = 'top';

            ctx.fillStyle = backgdCol;
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = color;
            ctx.fillText(name, borderSize, borderSize);

            return ctx.canvas;
        }

        function makeText(x, y, z, size, material, name, backgdCol, color) {
            const canvas = makeLabelCanvas(size, name, backgdCol, color);
            material.map = new THREE.CanvasTexture(canvas);

            const root = new THREE.Object3D();
            root.position.set(x, y, z);

            const label = new THREE.Mesh(labelGeometry, material);
            root.add(label);
            const labelBaseScale = 0.01;
            label.scale.x = canvas.width * labelBaseScale;
            label.scale.y = canvas.height * labelBaseScale;

            scene.add(root);
            return root;
        }

    </script>
