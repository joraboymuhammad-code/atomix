  function translateString(str) {
    if (!str || typeof str !== 'string') return str;
    let out = str;
    for (const [en, uz] of PHRASES) {
      if (out.includes(en)) {
        out = out.split(en).join(uz);
      } else {
        const re = new RegExp(en.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        if (re.test(out)) out = out.replace(re, uz);
      }
    }
    // Single-word whole-token replacements for common labels
    out = out.replace(/\b([A-Za-z][A-Za-z\s\/]{1,22})\b/g, (m) => {
      const upper = m.trim().toUpperCase();
      if (WORDS.has(upper)) return WORDS.get(upper);
      return m;
    });
    return out;
  }

  let translating = false;
  function translateDOM(root) {
    if (translating || !root) return;
    translating = true;
    try {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      let node;
      while ((node = walker.nextNode())) {
        const parent = node.parentElement;
        if (!parent) continue;
        const tag = parent.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'CODE' || parent.closest('.atomix-skip-translate')) continue;
        const orig = node.nodeValue;
        if (!orig || !/[A-Za-z]{2,}/.test(orig)) continue;
        const next = translateString(orig);
        if (next !== orig) node.nodeValue = next;
      }

      // Wire theory button if present
      const theoryBtn = document.getElementById('theorybutton');
      if (theoryBtn && !theoryBtn.dataset.atomixWired) {
        theoryBtn.dataset.atomixWired = '1';
        theoryBtn.textContent = 'NAZARIYA (1-PUNKT)';

          window.theorySite();
        };
      }
    } finally {
      translating = false;
    }
  }

  function initBridge() {
    if (!document.body) return;
    translateDOM(document.body);

    // Keep anchor links (#section) inside the local localized page instead of following <base href>
    document.addEventListener('click', (e) => {
      const a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
      if (!a) return;
      const hash = a.getAttribute('href');
      if (hash && hash.length > 1) {
        const target = document.getElementById(hash.slice(1));
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth' });
        }
      }
    });

    const observer = new MutationObserver((mutations) => {
      if (translating) return;
      for (const m of mutations) {
        for (const n of m.addedNodes) {
          if (n.nodeType === 1) translateDOM(n);
          else if (n.nodeType === 3 && n.parentElement) translateDOM(n.parentElement);
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true, characterData: false });

    // Periodic light pass for dynamic table/lil-gui text mutations
    setInterval(() => translateDOM(document.body), 900);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initBridge);
  } else {
    initBridge();
  }
})();

            });
            column = new THREE.Mesh(cylinderGeometry, cylinderMaterial)
            scene.add(column);
            column.position.y = 13;

            let geometry = new THREE.BoxGeometry(1, 1, 1).translate(0, 1 / 2, 0);
            let texture = new THREE.TextureLoader().load('./assets/gravity/waterNormal.jpg')

            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
            let material = new THREE.MeshPhongMaterial({
                color: 'aqua',
                side: THREE.DoubleSide,
                map: texture,
                transparent: true,
                opacity: 0.3
            });

            fluid = new THREE.Mesh(geometry, material);
            chamber1.add(fluid);
            fluid.scale.set(params.A * 4, params.A * params.H, params.A * 2 - 2)

            let steelMaterial = new THREE.MeshPhongMaterial({
                color: 'orange',
                side: THREE.DoubleSide,
                bumpMap: texture,
                shininess: 0,
                specular: 0xff0000
            });
            let woodMaterial = new THREE.MeshPhongMaterial({
                color: 'wheat',
                side: THREE.DoubleSide,
                bumpMap: texture,
                bumpScale: 0.2,
                specular: 0xff00ff
            });
            steel = new THREE.Mesh(geometry, steelMaterial)
            scene.add(steel)
            steel.scale.set(8, 4, 4)
            steel.position.set(-13, 0, 0)

            wood = new THREE.Mesh(geometry, woodMaterial)
            scene.add(wood)
            wood.scale.set(8, 4, 4)
            wood.position.set(13, 17, 0)

            column.add(addArrows(6, new THREE.Vector3(0, -1, 0), 'black', 'mg', new THREE.Vector3(0, 2, 3), 3))
            column.add(addArrows(8, new THREE.Vector3(0, -1, 0), 'blue', 'F<sub>air</sub>', new THREE.Vector3(0, 12, 0), 2))
            column.add(addArrows(0, new THREE.Vector3(0, -1, 0), 'blue', '1', new THREE.Vector3(0, 2, 0), 0))
            column.add(addArrows(8, new THREE.Vector3(0, 1, 0), 'red', 'F<sub>fluid</sub>', new THREE.Vector3(0, -12, 0), -2))
            column.add(addArrows(0, new THREE.Vector3(0, 1, 0), 'red', '2', new THREE.Vector3(0, -6, 0), 0))
            column.add(addArrows(4, new THREE.Vector3(0, -1, 0), 'black', 'h', new THREE.Vector3(5, 0, 0), 2))
            column.add(addArrows(4, new THREE.Vector3(0, 1, 0), 'black', '', new THREE.Vector3(5, 0, 0), 4))
            wood.add(addLabel('Wood', 0))
            steel.add(addLabel('Steel', 0))
            

            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        function createCamera(x, y, z) {

            fov = 55;
            const aspect = window.innerWidth / window.innerHeight;
            const near = 0.1;
            const far = 1500;

            camera = new THREE.PerspectiveCamera(fov, aspect, near, far);

            camera.position.set(x, y, z);
        }

        function createControls(x, y, z) {
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enablePan = true;
            controls.enableZoom = true;
            controls.target.set(x, y, z);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.1;
            controls.update();
            controls.addEventListener('change', render);
        }

        function createRenderer() {
            // create the renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.alpha = true;
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.body.appendChild(renderer.domElement);

            labelRenderer = new CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '-25px';
            labelRenderer.domElement.style.left = '-25px';
            labelRenderer.domElement.style.pointerEvents = 'none';
            document.body.appendChild(labelRenderer.domElement);

        }

        function createLights() {
            let hemiLight = new THREE.AmbientLight(0xffffff, .20);
            hemiLight.position.set(0, 20, 0);
            scene.add(hemiLight);

            let dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(-30, 50, -30);
            scene.add(dirLight);

            scene.add(new THREE.AmbientLight(0xffffff, .4));
        }

        function onWindowResize() {

            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);

        }

        function addLabels(name, col, x, y) {

            let text = document.createElement('div');
            text.className = 'label';
            text.innerHTML = name;
            text.style.color = col;

            let label = new CSS2DObject(text);
            label.position.x = x;
            label.position.y = y;

            return label
        }

        function render() {

            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        function animate() {

            requestAnimationFrame(animate);
            camera.lookAt(scene.position);
            controls.update();
            TWEEN.update();
            render();
            // console.log(column.position.y, spring.scale.y, mark.position.y)

        }

        function addArrows(len, dir, col, name, pos, Y) {
            // let a = THREE.MathUtils.degToRad(valueDegree);

            //normalize the direction vector (convert to vector of length 1)
            dir.normalize();

            const origin = new THREE.Vector3(0, 0, 0);
            const length = len;
            const hex = col;

            let arrowHelper = new THREE.ArrowHelper(dir, origin, length, hex);
            group.add(arrowHelper);
            let label = addLabel(name, Y);
            arrowHelper.add(label)
            arrowHelper.position.copy(pos);
            return group
        }

        function addLabel(name, Y) {
            let text = document.createElement('div');
            text.className = 'label';
            text.innerHTML = name;
            text.style.color = 'black';

            let label = new CSS2DObject(text);
            label.position.y = Y;
            return label
        }
    </script>
</body>

</html>
