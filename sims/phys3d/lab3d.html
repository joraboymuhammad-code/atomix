<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atomix 3D Photorealistic Physics Observatory (Three.js PBR)</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #030612; color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }
    .shell { display: flex; flex-direction: column; height: 100%; }
    .hud-bar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
      padding: 8px 14px;
      background: linear-gradient(180deg, rgba(13, 21, 44, 0.96), rgba(6, 10, 24, 0.96));
      border-bottom: 1px solid rgba(56, 189, 248, 0.28);
      z-index: 10;
    }
    .hud-left { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 700; }
    .badge {
      font-family: 'JetBrains Mono', monospace; font-size: 10.5px; padding: 3px 8px; border-radius: 6px;
      background: rgba(56, 189, 248, 0.16); border: 1px solid rgba(56, 189, 248, 0.45); color: #38bdf8;
    }
    .hud-ctrl { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    select, button {
      background: linear-gradient(180deg, rgba(22, 34, 64, 0.95), rgba(10, 17, 36, 0.98));
      color: #e2e8f0; border: 1px solid rgba(148, 163, 184, 0.28); border-bottom: 3px solid #020617;
      border-radius: 8px; padding: 5px 10px; font-size: 11.8px; font-weight: 600; cursor: pointer;
    }
    button:hover, button.active { border-color: #38bdf8; background: rgba(56, 189, 248, 0.2); color: #fff; }
    .stage { position: relative; flex: 1; overflow: hidden; }
    #webgl-host { position: absolute; inset: 0; width: 100%; height: 100%; }
    .ctrl-overlay {
      position: absolute; top: 12px; right: 12px; width: 256px; max-height: calc(100% - 76px); overflow-y: auto;
      background: rgba(6, 10, 24, 0.82); backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.28); border-radius: 14px; padding: 12px;
      display: flex; flex-direction: column; gap: 10px; z-index: 8;
    }
    .sl-row label { display: flex; justify-content: space-between; font-size: 11.5px; color: #cbd5e1; margin-bottom: 4px; }
    .sl-row strong { color: #38bdf8; font-family: 'JetBrains Mono', monospace; }
    .sl-row input[type="range"] { width: 100%; accent-color: #38bdf8; cursor: pointer; }
    .tele-box {
      padding: 9px 11px; border-radius: 10px; background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3); font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px; line-height: 1.55; color: #e0f2fe;
    }
    .bottom-hint {
      position: absolute; left: 12px; bottom: 12px; padding: 6px 12px; border-radius: 9px;
      background: rgba(6, 10, 24, 0.78); border: 1px solid rgba(148, 163, 184, 0.22);
      font-size: 11.5px; color: #94a3b8; pointer-events: none; z-index: 7;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="shell">
    <div class="hud-bar">
      <div class="hud-left">
        <span class="badge">Three.js PBR 3D</span>
        <span id="scene-title">3D Fizika Observatoriyasi</span>
      </div>
      <div class="hud-ctrl">
        <select id="scene-select"></select>
        <button id="pause-btn" type="button">⏸ Pauza</button>
        <button id="reset-cam-btn" type="button">🎥 Kamera</button>
      </div>
    </div>
    <div class="stage">
      <div id="webgl-host"></div>
      <div class="ctrl-overlay" id="ctrl-overlay"></div>
      <div class="bottom-hint">🖱 Sichqoncha bilan 360° aylantiring · Scroll — yaqinlashtirish · Real-time Three.js WebGL PBR</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const SCENES = {
      vernier_si: {
        title: '1. 3D Shtangensirkul & SI O‘lchov Stendi',
        cam: [0, 3.4, 8.2],
        controls: [
          { key: 'diam', label: 'Silindr diametri d', min: 1.0, max: 4.5, step: 0.1, val: 2.6, unit: 'sm' },
          { key: 'mass', label: 'Namuna massasi m', min: 0.2, max: 5.0, step: 0.1, val: 1.8, unit: 'kg' },
        ],
        telemetry: (v) => {
          const vol = Math.PI * Math.pow(v.diam / 2, 2) * 4;
          const rho = (v.mass * 1000) / vol;
          return `d = ${v.diam.toFixed(1)} sm (±0.05 mm)\nV = ${vol.toFixed(1)} sm³\nρ = ${rho.toFixed(2)} g/sm³`;
        },
      },
      vectors_3d: {
        title: '2. 3D Fazoviy Vektorlar & Vektor Ko‘paytma',
        cam: [6.2, 5.2, 7.2],
        controls: [
          { key: 'ax', label: 'A vektor uzunligi', min: 1, max: 4.5, step: 0.2, val: 3.2, unit: '' },
          { key: 'ang', label: 'A va B orasidagi burchak', min: 15, max: 165, step: 5, val: 65, unit: '°' },
        ],
        telemetry: (v) => {
          const b = 2.8, rad = (v.ang * Math.PI) / 180;
          const r = Math.sqrt(v.ax*v.ax + b*b + 2*v.ax*b*Math.cos(rad));
          const cross = v.ax * b * Math.sin(rad);
          return `|A + B| = ${r.toFixed(2)}\n|A × B| = ${cross.toFixed(2)}\nA · B = ${(v.ax*b*Math.cos(rad)).toFixed(2)}`;
        },
      },
      projectile_3d: {
        title: '3. 3D Ballistika Poligoni (Parabolik Uchish)',
        cam: [4, 5.2, 12.5],
        controls: [
          { key: 'v0', label: 'Boshlang‘ich tezlik v₀', min: 10, max: 35, step: 1, val: 22, unit: 'm/s' },
          { key: 'ang', label: 'Otish burchagi α', min: 15, max: 80, step: 2, val: 45, unit: '°' },
        ],
        telemetry: (v) => {
          const rad = (v.ang * Math.PI) / 180, g = 9.81;
          const L = (v.v0*v.v0*Math.sin(2*rad))/g, H = (v.v0*v.v0*Math.pow(Math.sin(rad),2))/(2*g);
          const T = (2*v.v0*Math.sin(rad))/g;
          return `Uchish masofasi L = ${L.toFixed(1)} m\nMaks. balandlik H = ${H.toFixed(1)} m\nVaqt T = ${T.toFixed(2)} s`;
        },
      },
      circular_centripetal: {
        title: '4. 3D Aylanma Harakat & Markazga Intilma Kuch',
        cam: [0, 6.2, 9.2],
        controls: [
          { key: 'omega', label: 'Burchak tezlik ω', min: 0.5, max: 4.5, step: 0.2, val: 2.0, unit: 'rad/s' },
          { key: 'rad', label: 'Orbita radiusi R', min: 1.5, max: 4.0, step: 0.2, val: 2.8, unit: 'm' },
        ],
        telemetry: (v) => `v = ωR = ${(v.omega*v.rad).toFixed(2)} m/s\naₙ = ω²R = ${(v.omega*v.omega*v.rad).toFixed(2)} m/s²\nT = ${(2*Math.PI/v.omega).toFixed(2)} s`,
      },
      inclined_friction: {
        title: '5. 3D Qiya Tekislik, Ishqalanish va Blok',
        cam: [5.5, 4.8, 9.5],
        controls: [
          { key: 'ang', label: 'Qiyalik burchagi α', min: 10, max: 55, step: 2, val: 28, unit: '°' },
          { key: 'mu', label: 'Ishqalanish koeff. μ', min: 0.05, max: 0.7, step: 0.05, val: 0.2, unit: '' },
        ],
        telemetry: (v) => {
          const rad = (v.ang * Math.PI) / 180, g = 9.81;
          const a = Math.max(0, g * (Math.sin(rad) - v.mu * Math.cos(rad)));
          return `a = ${a.toFixed(2)} m/s²\nF_ishq = ${(v.mu*g*Math.cos(rad)).toFixed(2)} N/kg\n${a > 0 ? 'Jism sirpanmoqda' : 'Tinchlikda muvozanat'}`;
        },
      },
      rocket_impulse: {
        title: '6. 3D Reaktiv Raketa & Nyuton Beshigi (Impuls)',
        cam: [0, 3.2, 10.5],
        controls: [
          { key: 'thrust', label: 'Reaktiv tortish kuchi', min: 1, max: 5, step: 0.2, val: 3.0, unit: 'MN' },
          { key: 'balls', label: 'Nyuton beshigi amplituda', min: 0.2, max: 1.0, step: 0.1, val: 0.7, unit: 'rad' },
        ],
        telemetry: (v) => `Impuls saqlanishi: Δp = F·Δt\nTortish: ${v.thrust.toFixed(1)} MN\nTezlanish nisbati: ${(v.thrust*2.4).toFixed(1)} m/s²`,
      },
      gyro_torque: {
        title: '7. 3D Giroskop Pretsessiyasi & Kuch Momenti',
        cam: [5.5, 4.5, 7.5],
        controls: [
          { key: 'spin', label: 'Rotor aylanish tezligi', min: 1, max: 10, step: 0.5, val: 6.5, unit: '×' },
          { key: 'tilt', label: 'Og‘ish burchagi θ', min: 10, max: 55, step: 3, val: 28, unit: '°' },
        ],
        telemetry: (v) => `L = I·ω (Saqlanadi)\nPretsessiya Ω = ${(4.5 / v.spin).toFixed(2)} rad/s\nOg‘ish: ${v.tilt}°`,
      },
      hydro_windtunnel: {
        title: '8. 3D Aerodinamik Qanot (Bernulli) & Gidropress',
        cam: [0, 3.8, 10.2],
        controls: [
          { key: 'vel', label: 'Havo oqimi tezligi v', min: 10, max: 80, step: 5, val: 45, unit: 'm/s' },
          { key: 'aoa', label: 'Hujum burchagi α', min: 0, max: 20, step: 2, val: 8, unit: '°' },
        ],
        telemetry: (v) => {
          const dp = 0.5 * 1.225 * v.vel * v.vel * (0.28 + v.aoa * 0.03);
          return `Bernulli Δp = ${(dp/1000).toFixed(2)} kPa\nKo‘tarish kuchi: ${(dp * 0.015).toFixed(1)} N\nOqim: Laminar`;
        },
      },
      doppler_acoustic: {
        title: '9. 3D Dopler Effekti & Tovush To‘lqin Konusi',
        cam: [0, 8.8, 9.2],
        controls: [
          { key: 'mach', label: 'Manba tezligi (Max soni)', min: 0.0, max: 1.4, step: 0.1, val: 0.6, unit: 'M' },
          { key: 'freq', label: 'Chastota f₀', min: 200, max: 900, step: 50, val: 440, unit: 'Hz' },
        ],
        telemetry: (v) => {
          const fFront = v.mach < 0.98 ? (v.freq / (1 - v.mach)).toFixed(0) : 'ZARBA TO‘LQINI!';
          return `v / c = ${v.mach.toFixed(1)} Max\nOldinda f = ${fFront} Hz\nOrqada f = ${(v.freq / (1 + v.mach)).toFixed(0)} Hz`;
        },
      },
      thermo_engine_3d: {
        title: '10. 3D Shisha Porshenli Ideal Gaz & Termodinamika',
        cam: [5.5, 4.2, 8.8],
        controls: [
          { key: 'temp', label: 'Harorat T', min: 180, max: 900, step: 20, val: 380, unit: 'K' },
          { key: 'vol', label: 'Porshen hajmi V', min: 1.5, max: 4.5, step: 0.2, val: 3.0, unit: 'L' },
        ],
        telemetry: (v) => {
          const P = (8.314 * v.temp) / v.vol;
          return `PV = νRT → P = ${P.toFixed(0)} kPa\n⟨E_k⟩ = ${(1.5*1.38e-23*v.temp*1e21).toFixed(2)}×10⁻²¹ J\nv_o‘rt ≈ ${Math.sqrt(3*8.314*v.temp/0.028).toFixed(0)} m/s`;
        },
      },
      electro_field_3d: {
        title: '11. 3D Elektr Dipol Maydoni & Kondensator',
        cam: [0, 4.5, 10.5],
        controls: [
          { key: 'q', label: 'Zaryad kattaligi q', min: 1, max: 10, step: 1, val: 5, unit: 'μC' },
          { key: 'eps', label: 'Dielektrik ε', min: 1, max: 8, step: 0.5, val: 2.5, unit: '' },
        ],
        telemetry: (v) => `E = kq / (εr²) = ${(9*v.q/v.eps).toFixed(1)} kV/m\nSig‘im nisbati: ${v.eps.toFixed(1)}×\nDipol chiziqlari: +q → −q`,
      },
      circuit_board_3d: {
        title: '12. 3D Elektr Zanjiri, Om & Joul-Lens Qizishi',
        cam: [0, 6.8, 7.6],
        controls: [
          { key: 'volt', label: 'Manba kuchlanishi U', min: 3, max: 24, step: 1, val: 12, unit: 'V' },
          { key: 'res', label: 'Rezistor qarshiligi R', min: 2, max: 20, step: 1, val: 6, unit: 'Ω' },
        ],
        telemetry: (v) => {
          const I = v.volt / v.res, P = v.volt * I;
          return `Tok kuchi I = U/R = ${I.toFixed(2)} A\nQuvvat P = I²R = ${P.toFixed(1)} W\nElektronlar oqimi: (−) → (+)`;
        },
      },
      electrolysis_3d: {
        title: '13. 3D Elektroliz Vannasi & Ionlar Migratsiyasi',
        cam: [0, 4.6, 8.8],
        controls: [
          { key: 'curr', label: 'Tok kuchi I', min: 1, max: 12, step: 1, val: 5, unit: 'A' },
        ],
        telemetry: (v) => `Faradey qonuni: m = k·I·t\nCu²⁺ → Katod (−) da qoplama\nSO₄²⁻ → Anod (+) da O₂↑`,
      },
      plasma_crt_3d: {
        title: '14. 3D Elektron-Nur Trubkasi (ELT) & Gaz Plazmasi',
        cam: [0, 3.8, 10.5],
        controls: [
          { key: 'defl', label: 'Og‘diruvchi maydon E/B', min: -3, max: 3, step: 0.2, val: 1.2, unit: 'kV' },
          { key: 'uAcc', label: 'Tezlatuvchi kuchlanish', min: 1, max: 10, step: 1, val: 5, unit: 'kV' },
        ],
        telemetry: (v) => `v_e = √(2eU/m) ≈ ${(Math.sqrt(v.uAcc)*1.87).toFixed(1)}×10⁷ m/s\nNurni og‘dirish: ${v.defl.toFixed(1)} kV`,
      },
      semiconductor_3d: {
        title: '15. 3D Yarimo‘tkazgich p-n O‘tish & LED Fotonlar',
        cam: [0, 4.2, 9.2],
        controls: [
          { key: 'bias', label: 'Kuchlanish (−Teskari / +To‘g‘ri)', min: -3, max: 5, step: 0.5, val: 3.0, unit: 'V' },
        ],
        telemetry: (v) => v.bias > 0.6 ? `TO‘G‘RI ULANISH (+${v.bias}V)\nRekombinatsiya → LED fotonlari nurlanmoqda!` : `TESKARI ULANISH (${v.bias}V)\nTo‘siq qatlami kengaydi — tok o‘tmaydi`,
      },
      magnet_induction_3d: {
        title: '16. 3D Solenoid, Magnit & Faradey Induksiyasi',
        cam: [4.8, 4.2, 8.6],
        controls: [
          { key: 'spd', label: 'Magnit harakat tezligi', min: 0.5, max: 5.0, step: 0.3, val: 2.4, unit: 'Hz' },
          { key: 'turns', label: 'G‘altak o‘ramlari N', min: 4, max: 16, step: 2, val: 10, unit: '' },
        ],
        telemetry: (v) => `Faradey: |ε_i| = N·|dΦ/dt|\nMaks. EYuK ≈ ${(v.spd * v.turns * 0.45).toFixed(1)} V\nLens qoidasi bo‘yicha yo‘nalish`,
      },
      em_wave_3d: {
        title: '17. 3D Elektromagnit To‘lqin (E ⊥ B ⊥ c)',
        cam: [4.5, 4.5, 10.5],
        controls: [
          { key: 'freq', label: 'To‘lqin chastotasi', min: 0.5, max: 3.0, step: 0.2, val: 1.4, unit: '×' },
          { key: 'amp', label: 'Amplituda E₀, B₀', min: 0.6, max: 2.2, step: 0.2, val: 1.5, unit: '' },
        ],
        telemetry: (v) => `E ⊥ B ⊥ c (Ko‘ndalang to‘lqin)\nc = 1 / √(ε₀μ₀) = 3·10⁸ m/s\nλ nisbati: ${(2.0 / v.freq).toFixed(2)}`,
      },
      optics_bench_3d: {
        title: '18. 3D Shisha Prizma Dispersiyasi & Polyarizator',
        cam: [0, 4.8, 10.2],
        controls: [
          { key: 'nIdx', label: 'Shisha sindirish n', min: 1.3, max: 1.9, step: 0.05, val: 1.55, unit: '' },
          { key: 'pol', label: 'Malyus burchagi θ', min: 0, max: 90, step: 5, val: 30, unit: '°' },
        ],
        telemetry: (v) => {
          const mal = Math.pow(Math.cos((v.pol * Math.PI) / 180), 2) * 100;
          return `Dispersiya: n(binafsha) > n(qizil)\nMalyus: I = I₀·cos²(${v.pol}°) = ${mal.toFixed(1)}%`;
        },
      },
      relativity_3d: {
        title: '19. 3D Fazo-Vaqt Egriligi & Lorens Qisqarishi',
        cam: [0, 6.2, 10.5],
        controls: [
          { key: 'beta', label: 'Kema tezligi v / c', min: 0.0, max: 0.96, step: 0.04, val: 0.72, unit: 'c' },
          { key: 'mass', label: 'Yulduz massasi M', min: 0.5, max: 3.0, step: 0.25, val: 1.5, unit: 'M☉' },
        ],
        telemetry: (v) => {
          const g = 1 / Math.sqrt(Math.max(0.01, 1 - v.beta * v.beta));
          return `Lorens omili γ = ${g.toFixed(2)}\nUzunlik qisqarishi: L/L₀ = ${(1/g).toFixed(2)}\nVaqt sekinlashuvi: ${g.toFixed(2)}×`;
        },
      },
      photoelectric_laser_3d: {
        title: '20. 3D Fotoeffekt & Rubin Lazer Rezonatori',
        cam: [0, 3.8, 9.8],
        controls: [
          { key: 'lam', label: 'Yorug‘lik to‘lqin uzunligi λ', min: 200, max: 700, step: 20, val: 340, unit: 'nm' },
          { key: 'work', label: 'Chiqish ishi A_chiq', min: 1.8, max: 4.5, step: 0.2, val: 2.3, unit: 'eV' },
        ],
        telemetry: (v) => {
          const Ef = 1240 / v.lam;
          const Ek = Math.max(0, Ef - v.work);
          return `Foton hν = ${Ef.toFixed(2)} eV\nE_k(max) = ${Ek.toFixed(2)} eV\n${Ek > 0 ? 'FOTOELEKTRONLAR UCHMOQDA!' : 'Qizil chegara — fotoeffekt yo‘q'}`;
        },
      },
      nuclear_reactor_3d: {
        title: '21. 3D Termoyadro Tokamak & U-235 Zanjir Reaksiyasi',
        cam: [0, 5.2, 9.6],
        controls: [
          { key: 'rod', label: 'Kadmium sterjen (Nazorat k)', min: 0.5, max: 1.6, step: 0.1, val: 1.0, unit: '' },
          { key: 'plasma', label: 'Tokamak magnit maydoni B', min: 2, max: 12, step: 1, val: 7, unit: 'T' },
        ],
        telemetry: (v) => `Neytron ko‘payish k = ${v.rod.toFixed(1)}\nHolat: ${v.rod < 0.95 ? 'So‘nuvchi' : v.rod <= 1.05 ? 'BARQAROR REAKTOR' : 'O‘ta kritik!'}\nTokamak plazma: ~150 mln K`,
      },
      lhc_collider_3d: {
        title: '22. 3D CERN Adron Kollayderi & Zarralar To‘qnashuvi',
        cam: [0, 6.2, 9.2],
        controls: [
          { key: 'energy', label: 'Protonlar energiyasi', min: 1, max: 14, step: 1, val: 13, unit: 'TeV' },
        ],
        telemetry: (v) => `To‘qnashuv √s = ${v.energy} TeV\nv = 0.99999999 c\nKvarklar, Gluonlar & Xiggs bozoni!`,
      },
      solar_kepler_3d: {
        title: '23. 3D Quyosh Sistemasi & Kepler Orbitalari',
        cam: [0, 8.8, 13.5],
        controls: [
          { key: 'speed', label: 'Orbital vaqt tezligi', min: 0.2, max: 4.0, step: 0.2, val: 1.2, unit: '×' },
        ],
        telemetry: (v) => `Kepler 3-qonuni: T² / a³ = const\nQuyosh → Merkuriy → Venera → Yer → Mars → Saturn`,
      },
      blackhole_cosmos_3d: {
        title: '24. 3D Qora Tuynuk Akkretsiya Diski & Xabbl Koinoti',
        cam: [0, 3.6, 10.5],
        controls: [
          { key: 'spin', label: 'Akkretsiya aylanishi', min: 0.5, max: 3.5, step: 0.25, val: 1.5, unit: '×' },
          { key: 'hubble', label: 'Xabbl kengayishi H₀', min: 0, max: 2.0, step: 0.2, val: 0.8, unit: '×' },
        ],
        telemetry: (v) => `Shvartsshild radiusi: r_g = 2GM/c²\nXabbl qonuni: v = H₀ · r\nGravitatsion linzalash faol!`,
      },
    };

    const params = new URLSearchParams(location.search);
    let curKey = SCENES[params.get('scene')] ? params.get('scene') : 'solar_kepler_3d';
    let values = {};
    let paused = false;

    const sel = document.getElementById('scene-select');
    Object.entries(SCENES).forEach(([k, s]) => {
      const o = document.createElement('option');
      o.value = k; o.textContent = s.title; sel.appendChild(o);
    });

    const host = document.getElementById('webgl-host');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    host.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#040816');
    scene.fog = new THREE.FogExp2('#040816', 0.022);

    const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 200);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    // Studio Lighting Rig
    const hemi = new THREE.HemisphereLight('#a5f3fc', '#0f172a', 0.85);
    scene.add(hemi);
    const keyLight = new THREE.DirectionalLight('#ffffff', 1.8);
    keyLight.position.set(8, 12, 9);
    scene.add(keyLight);
    const rimLight = new THREE.PointLight('#22d3ee', 2.4, 30);
    rimLight.position.set(-8, 6, -6);
    scene.add(rimLight);
    const warmLight = new THREE.PointLight('#f472b6', 1.6, 28);
    warmLight.position.set(7, -3, -7);
    scene.add(warmLight);

    // Subtle Lab Grid Floor
    const grid = new THREE.GridHelper(24, 24, '#1e3a5f', '#0f1c33');
    grid.position.y = -2.4;
    scene.add(grid);

    let activeGroup = new THREE.Group();
    scene.add(activeGroup);
    let updater = null;

    function resize() {
      const r = host.getBoundingClientRect();
      if (r.width < 10) return;
      camera.aspect = r.width / r.height;
      camera.updateProjectionMatrix();
      renderer.setSize(r.width, r.height);
    }
    window.addEventListener('resize', resize);
    resize();

    function stdMat(col, metal = 0.45, rough = 0.28, em = null, emI = 0.35, trans = false, op = 1) {
      return new THREE.MeshStandardMaterial({
        color: col, metalness: metal, roughness: rough,
        emissive: em || '#000000', emissiveIntensity: em ? emI : 0,
        transparent: trans, opacity: op,
      });
    }

    function clearGroup() {
      while (activeGroup.children.length) activeGroup.remove(activeGroup.children[0]);
      updater = null;
    }

    function makeArrow3D(dir, orig, len, col) {
      return new THREE.ArrowHelper(dir.clone().normalize(), orig, Math.max(0.2, len), col, 0.45, 0.26);
    }

    function buildScene(key) {
      clearGroup();
      const def = SCENES[key];
      document.getElementById('scene-title').textContent = def.title;
      camera.position.set(...def.cam);
      controls.target.set(0, 0, 0);
      controls.update();

      const g = activeGroup;

      if (key === 'solar_kepler_3d') {
        grid.visible = false;
        const sun = new THREE.Mesh(new THREE.SphereGeometry(1.45, 36, 36), stdMat('#fde047', 0.1, 0.2, '#f97316', 1.5));
        g.add(sun);
        const corona = new THREE.Mesh(new THREE.SphereGeometry(1.85, 28, 28), stdMat('#fb923c', 0, 1, '#fb923c', 0.8, true, 0.22));
        g.add(corona);
        const planets = [
          { r: 2.5, sz: 0.22, col: '#cbd5e1', spd: 2.2 },
          { r: 3.5, sz: 0.34, col: '#fbbf24', spd: 1.55 },
          { r: 4.8, sz: 0.42, col: '#38bdf8', spd: 1.15 },
          { r: 6.1, sz: 0.32, col: '#ef4444', spd: 0.85 },
          { r: 8.2, sz: 0.72, col: '#d97706', spd: 0.52, ring: true },
        ];
        const meshes = planets.map((p, idx) => {
          const orbGeo = new THREE.RingGeometry(p.r - 0.025, p.r + 0.025, 72);
          const orb = new THREE.Mesh(orbGeo, new THREE.MeshBasicMaterial({ color: '#38bdf8', side: THREE.DoubleSide, transparent: true, opacity: 0.28 }));
          orb.rotation.x = Math.PI / 2; g.add(orb);
          const m = new THREE.Mesh(new THREE.SphereGeometry(p.sz, 24, 24), stdMat(p.col, 0.25, 0.45));
          if (p.ring) {
            const rg = new THREE.Mesh(new THREE.RingGeometry(p.sz * 1.4, p.sz * 2.2, 48), new THREE.MeshBasicMaterial({ color: '#fde68a', side: THREE.DoubleSide, transparent: true, opacity: 0.6 }));
            rg.rotation.x = Math.PI / 2.4; m.add(rg);
          }
          g.add(m);
          return { m, ...p, phase: idx * 1.3 };
        });
        updater = (t) => {
          sun.rotation.y = t * 0.2;
          meshes.forEach((p) => {
            const a = t * p.spd * values.speed + p.phase;
            p.m.position.set(Math.cos(a) * p.r, 0, Math.sin(a) * p.r * 0.92);
            p.m.rotation.y = t * 1.2;
          });
        };
      } else if (key === 'blackhole_cosmos_3d') {
        grid.visible = false;
        const bh = new THREE.Mesh(new THREE.SphereGeometry(1.35, 36, 36), new THREE.MeshBasicMaterial({ color: '#000000' }));
        g.add(bh);
        const photonRing = new THREE.Mesh(new THREE.TorusGeometry(1.52, 0.07, 16, 72), stdMat('#fef08a', 0.1, 0.1, '#facc15', 2.2));
        g.add(photonRing);
        const disk = new THREE.Mesh(new THREE.RingGeometry(1.8, 4.6, 80), new THREE.MeshBasicMaterial({ color: '#f97316', side: THREE.DoubleSide, transparent: true, opacity: 0.72 }));
        disk.rotation.x = Math.PI / 2.25; g.add(disk);
        const disk2 = new THREE.Mesh(new THREE.RingGeometry(2.2, 3.8, 80), new THREE.MeshBasicMaterial({ color: '#fde047', side: THREE.DoubleSide, transparent: true, opacity: 0.55 }));
        disk2.rotation.x = Math.PI / 2.25; g.add(disk2);
        const jet = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.45, 9, 20, 1, true), new THREE.MeshBasicMaterial({ color: '#38bdf8', transparent: true, opacity: 0.28, side: THREE.DoubleSide }));
        g.add(jet);
        const stars = Array.from({ length: 70 }, (_, i) => {
          const s = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 10), stdMat(i % 2 ? '#e0f2fe' : '#f472b6', 0.1, 0.2, '#38bdf8', 0.9));
          const th = i * 2.39, ph = Math.acos(1 - 2 * ((i + 0.5) / 70));
          s.userData = { dir: new THREE.Vector3(Math.sin(ph)*Math.cos(th), Math.cos(ph), Math.sin(ph)*Math.sin(th)), base: 4.5 + (i % 5) * 1.1 };
          g.add(s); return s;
        });
        updater = (t) => {
          disk.rotation.z = t * values.spin;
          disk2.rotation.z = -t * values.spin * 1.4;
          photonRing.lookAt(camera.position);
          const exp = 1 + ((t * values.hubble * 0.15) % 0.85);
          stars.forEach((s) => s.position.copy(s.userData.dir).multiplyScalar(s.userData.base * exp));
        };
      } else if (key === 'circuit_board_3d') {
        grid.visible = true;
        const board = new THREE.Mesh(new THREE.BoxGeometry(8.5, 0.3, 5.4), stdMat('#064e3b', 0.2, 0.6));
        board.position.y = -0.35; g.add(board);
        const batt = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 1.8, 24), stdMat('#1e293b', 0.7, 0.3, '#0284c7', 0.3));
        batt.position.set(-3.1, 0.7, 0); g.add(batt);
        const resMat = stdMat('#d97706', 0.3, 0.4, '#ef4444', 0.2);
        const res = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 2.2, 24), resMat);
        res.rotation.z = Math.PI / 2; res.position.set(1.2, 0.5, -1.6); g.add(res);
        // Wire loop & flowing electrons
        const pts = [new THREE.Vector3(-3.1,0.5,-1.6), new THREE.Vector3(3.2,0.5,-1.6), new THREE.Vector3(3.2,0.5,1.6), new THREE.Vector3(-3.1,0.5,1.6)];
        for (let i = 0; i < 4; i++) {
          const a = pts[i], b = pts[(i+1)%4];
          const wire = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, a.distanceTo(b), 12), stdMat('#f59e0b', 0.85, 0.22));
          wire.position.copy(a).lerp(b, 0.5);
          wire.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), b.clone().sub(a).normalize());
          g.add(wire);
        }
        const electrons = Array.from({ length: 18 }, (_, i) => {
          const e = new THREE.Mesh(new THREE.SphereGeometry(0.14, 14, 14), stdMat('#22d3ee', 0.1, 0.2, '#22d3ee', 1.4));
          g.add(e); return { m: e, off: i / 18 };
        });
        updater = (t) => {
          const I = (values.volt || 12) / Math.max(0.1, values.res || 6);
          resMat.emissiveIntensity = Math.min(2.2, (I * (values.volt || 12)) / 30);
          electrons.forEach((e) => {
            const u = ((e.off + t * I * 0.08) % 1 + 1) % 1;
            const seg = Math.floor(u * 4) % 4;
            const f = (u * 4) - Math.floor(u * 4);
            e.m.position.copy(pts[seg]).lerp(pts[(seg + 1) % 4], f);
          });
        };
      } else if (key === 'em_wave_3d') {
        grid.visible = true;
        const axis = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 10, 12), stdMat('#94a3b8', 0.6, 0.3));
        axis.rotation.z = Math.PI / 2; g.add(axis);
        const N = 32;
        const eBars = [], bBars = [];
        for (let i = 0; i < N; i++) {
          const x = -4.8 + (i / (N - 1)) * 9.6;
          const eb = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1, 10), stdMat('#22d3ee', 0.2, 0.2, '#22d3ee', 0.9));
          eb.position.x = x; g.add(eb); eBars.push(eb);
          const bb = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1, 10), stdMat('#f472b6', 0.2, 0.2, '#f472b6', 0.9));
          bb.rotation.x = Math.PI / 2; bb.position.x = x; g.add(bb); bBars.push(bb);
        }
        updater = (t) => {
          for (let i = 0; i < N; i++) {
            const val = Math.sin(i * 0.42 * values.freq - t * 3.5) * values.amp;
            eBars[i].scale.y = Math.max(0.05, Math.abs(val)); eBars[i].position.y = val / 2;
            bBars[i].scale.y = Math.max(0.05, Math.abs(val)); bBars[i].position.z = val / 2;
          }
        };
      } else if (key === 'relativity_3d') {
        grid.visible = false;
        const geo = new THREE.PlaneGeometry(11, 11, 28, 28);
        geo.rotateX(-Math.PI / 2);
        const pos = geo.attributes.position;
        const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: '#38bdf8', wireframe: true, transparent: true, opacity: 0.45 }));
        g.add(mesh);
        const star = new THREE.Mesh(new THREE.SphereGeometry(0.85, 28, 28), stdMat('#fde047', 0.2, 0.2, '#f59e0b', 1.4));
        g.add(star);
        const ship = new THREE.Mesh(new THREE.ConeGeometry(0.45, 2.2, 16), stdMat('#e2e8f0', 0.8, 0.2, '#22d3ee', 0.4));
        ship.rotation.z = -Math.PI / 2; ship.position.set(0, 2.2, 2.6); g.add(ship);
        updater = (t) => {
          for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i), z = pos.getZ(i), r = Math.hypot(x, z);
            pos.setY(i, -values.mass * 2.1 / (r + 0.85));
          }
          pos.needsUpdate = true;
          const gamma = 1 / Math.sqrt(Math.max(0.02, 1 - values.beta * values.beta));
          ship.scale.set(1, 1 / gamma, 1);
          ship.position.x = Math.sin(t * (0.6 + values.beta * 2.4)) * 3.8;
        };
      } else if (key === 'nuclear_reactor_3d' || key === 'lhc_collider_3d') {
        grid.visible = true;
        const torus = new THREE.Mesh(new THREE.TorusGeometry(3.1, 0.62, 24, 64), stdMat('#a855f7', 0.2, 0.2, '#ec4899', 1.2, true, 0.52));
        torus.rotation.x = Math.PI / 2; g.add(torus);
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2;
          const coil = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.11, 14, 32), stdMat('#38bdf8', 0.85, 0.2));
          coil.position.set(Math.cos(a) * 3.1, 0, Math.sin(a) * 3.1);
          coil.rotation.y = -a; g.add(coil);
        }
        const particles = Array.from({ length: 24 }, (_, i) => {
          const p = new THREE.Mesh(new THREE.SphereGeometry(0.16, 14, 14), stdMat(i % 2 ? '#fde047' : '#22d3ee', 0.1, 0.2, '#fde047', 1.5));
          g.add(p); return { m: p, off: (i / 24) * Math.PI * 2, dir: i % 2 ? 1 : -1 };
        });
        updater = (t) => {
          const spd = key === 'lhc_collider_3d' ? values.energy * 0.25 : (values.plasma || 6) * 0.3;
          particles.forEach((p, idx) => {
            const a = p.off + t * spd * p.dir;
            p.m.position.set(Math.cos(a) * 3.1, Math.sin(a * 4 + idx) * 0.25, Math.sin(a) * 3.1);
          });
        };
      } else if (key === 'optics_bench_3d') {
        grid.visible = true;
        const prism = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 2.2, 3), stdMat('#bae6fd', 0.1, 0.08, '#38bdf8', 0.25, true, 0.48));
        g.add(prism);
        const whiteBeam = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 5, 12), stdMat('#ffffff', 0, 0, '#ffffff', 1.8));
        whiteBeam.rotation.z = Math.PI / 2 - 0.18; whiteBeam.position.set(-3.2, -0.45, 0); g.add(whiteBeam);
        const colors = ['#ef4444','#f97316','#facc15','#22c55e','#38bdf8','#818cf8','#c084fc'];
        const rays = colors.map((c, idx) => {
          const r = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 5.2, 10), stdMat(c, 0, 0, c, 1.6));
          g.add(r); return { r, idx };
        });
        updater = () => {
          const spread = (values.nIdx - 1.2) * 0.35;
          rays.forEach(({ r, idx }) => {
            const ang = -0.15 - idx * 0.075 * spread;
            r.rotation.z = Math.PI / 2 + ang;
            r.position.set(3.2, -0.25 + ang * 2.3, 0);
          });
        };
      } else if (key === 'thermo_engine_3d') {
        grid.visible = true;
        const cyl = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 2.1, 4.6, 32, 1, true), stdMat('#93c5fd', 0.1, 0.1, '#38bdf8', 0.12, true, 0.24));
        g.add(cyl);
        const piston = new THREE.Mesh(new THREE.CylinderGeometry(2.02, 2.02, 0.35, 32), stdMat('#94a3b8', 0.85, 0.22));
        g.add(piston);
        const mols = Array.from({ length: 36 }, (_, i) => {
          const m = new THREE.Mesh(new THREE.SphereGeometry(0.16, 14, 14), stdMat('#38bdf8', 0.2, 0.25, '#fb923c', 0.5));
          g.add(m);
          return { m, seed: i * 1.93 };
        });
        updater = (t) => {
          const topY = -2.1 + (values.vol / 4.5) * 4.0;
          piston.position.y = topY;
          const spd = Math.sqrt(values.temp / 280) * 1.6;
          mols.forEach((o) => {
            const ang = o.seed * 3.1 + t * spd;
            const rad = Math.abs(Math.sin(o.seed + t * spd * 0.7)) * 1.75;
            const y = -2.0 + Math.abs(Math.cos(o.seed * 2.1 + t * spd * 0.9)) * Math.max(0.4, topY + 1.8);
            o.m.position.set(Math.cos(ang) * rad, y, Math.sin(ang) * rad);
            o.m.material.color.setHSL(Math.max(0, 0.6 - (values.temp - 180) / 1100), 0.9, 0.58);
          });
        };
      } else if (key === 'projectile_3d') {
        grid.visible = true;
        const cannon = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.4, 2.0, 20), stdMat('#64748b', 0.8, 0.25));
        cannon.position.set(-4.5, -1.6, 0); g.add(cannon);
        const ball = new THREE.Mesh(new THREE.SphereGeometry(0.28, 22, 22), stdMat('#fde047', 0.5, 0.2, '#f97316', 1.1));
        g.add(ball);
        const dots = Array.from({ length: 28 }, () => {
          const d = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10), stdMat('#22d3ee', 0.1, 0.2, '#22d3ee', 1.0));
          g.add(d); return d;
        });
        updater = (t) => {
          const rad = (values.ang * Math.PI) / 180, gAcc = 9.81, sc = 0.12;
          cannon.rotation.z = -(Math.PI / 2 - rad);
          const T = (2 * values.v0 * Math.sin(rad)) / gAcc;
          dots.forEach((d, idx) => {
            const tt = (idx / (dots.length - 1)) * T;
            d.position.set(-4.5 + values.v0 * Math.cos(rad) * tt * sc, -1.8 + (values.v0 * Math.sin(rad) * tt - 0.5 * gAcc * tt * tt) * sc, 0);
          });
          const curT = (t * 1.4) % Math.max(0.2, T);
          ball.position.set(-4.5 + values.v0 * Math.cos(rad) * curT * sc, -1.8 + (values.v0 * Math.sin(rad) * curT - 0.5 * gAcc * curT * curT) * sc, 0);
        };
      } else {
        // Dedicated Interactive 3D Metallic/Holographic Apparatus for Remaining Specialized Modes
        grid.visible = true;
        const hub = new THREE.Mesh(new THREE.OctahedronGeometry(1.15, 1), stdMat('#38bdf8', 0.75, 0.18, '#0ea5e9', 0.55));
        g.add(hub);
        const rings = [0, 1, 2].map((i) => {
          const rg = new THREE.Mesh(new THREE.TorusGeometry(2.1 + i * 0.75, 0.09, 16, 64), stdMat(i===0?'#22d3ee':i===1?'#a855f7':'#34d399', 0.75, 0.2, i===0?'#22d3ee':'#a855f7', 0.6));
          g.add(rg); return rg;
        });
        const satGroup = new THREE.Group(); g.add(satGroup);
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2;
          const orb = new THREE.Mesh(new THREE.SphereGeometry(0.24, 18, 18), stdMat(i%2?'#f472b6':'#fde047', 0.3, 0.2, i%2?'#f472b6':'#fde047', 1.0));
          orb.position.set(Math.cos(a) * 3.0, Math.sin(a * 2) * 0.8, Math.sin(a) * 3.0);
          satGroup.add(orb);
        }
        const vArrow = makeArrow3D(new THREE.Vector3(1, 0.6, 0), new THREE.Vector3(0, 0, 0), 3.4, 0x34d399);
        g.add(vArrow);
        updater = (t) => {
          const p0 = Object.values(values)[0] || 2;
          const rate = 0.5 + Math.abs(Number(p0)) * 0.15;
          hub.rotation.y = t * rate; hub.rotation.x = t * 0.4;
          rings[0].rotation.x = t * rate; rings[1].rotation.y = -t * rate * 0.8; rings[2].rotation.z = t * rate * 0.5;
          satGroup.rotation.y = t * rate * 0.65;
          vArrow.rotation.y = t * rate * 0.5;
        };
      }
    }

    function loadScene(key) {
      curKey = key; sel.value = key;
      const def = SCENES[key];
      values = {};
      def.controls.forEach((c) => (values[c.key] = c.val));
      const box = document.getElementById('ctrl-overlay');
      box.innerHTML = def.controls.map((c) => `
        <div class="sl-row">
          <label><span>${c.label}</span><strong id="ro-${c.key}">${values[c.key]} ${c.unit}</strong></label>
          <input type="range" data-k="${c.key}" min="${c.min}" max="${c.max}" step="${c.step}" value="${values[c.key]}" />
        </div>`).join('') + `<div class="tele-box" id="tele-box"></div>`;
      updateTelemetry();
      buildScene(key);
    }

    function updateTelemetry() {
      const el = document.getElementById('tele-box');
      if (el) el.innerHTML = SCENES[curKey].telemetry(values).replaceAll('\n', '<br>');
    }

    document.getElementById('ctrl-overlay').addEventListener('input', (e) => {
      const k = e.target.dataset.k; if (!k) return;
      values[k] = Number(e.target.value);
      const def = SCENES[curKey].controls.find((c) => c.key === k);
      const ro = document.getElementById(`ro-${k}`);
      if (ro && def) ro.textContent = `${values[k]} ${def.unit}`;
      updateTelemetry();
    });
    sel.addEventListener('change', () => loadScene(sel.value));
    document.getElementById('pause-btn').addEventListener('click', (e) => {
      paused = !paused;
      e.target.textContent = paused ? '▶ Davom' : '⏸ Pauza';
      e.target.classList.toggle('active', paused);
    });
    document.getElementById('reset-cam-btn').addEventListener('click', () => {
      camera.position.set(...SCENES[curKey].cam);
      controls.target.set(0, 0, 0);
      controls.update();
    });

    let elapsed = 0;
    let lastTs = performance.now();
    function animate(ts) {
      requestAnimationFrame(animate);
      const dt = Math.max(0, Math.min(0.05, (ts - lastTs) / 1000));
      lastTs = ts;
      if (!paused) elapsed += dt;
      if (updater) updater(elapsed);
      controls.update();
      renderer.render(scene, camera);
    }

    loadScene(curKey);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
